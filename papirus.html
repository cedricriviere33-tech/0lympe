<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papirus 📚</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --paper:#f4f0e6; --paper2:#eae4d3; --ink:#2b2620; --ink2:#6b6357; --line:#d9d0bd;
  --accent:#6d5a3f; --accent2:#8a7350; --shelf:#cbb994; --card:#fbf8f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{ background:var(--paper); color:var(--ink);
  font-family:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  overflow-x:hidden; }
/* ── En-tête ── */
.pp-top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:14px 18px; background:linear-gradient(180deg,var(--paper2),var(--paper));
  border-bottom:1px solid var(--line); }
.pp-logo{ font-size:22px; }
.pp-ttl{ flex:1; }
.pp-ttl h1{ font-size:21px; letter-spacing:1px; font-weight:700; color:var(--accent); }
.pp-ttl .s{ font-size:11px; color:var(--ink2); letter-spacing:.5px; }
.pp-btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
  border-radius:8px; padding:8px 13px; font-family:inherit; font-size:13px; font-weight:600;
  display:inline-flex; align-items:center; gap:6px; transition:.15s; }
.pp-btn:hover{ background:#efe9da; }
.pp-btn.accent{ background:var(--accent); color:#fdf8ee; border-color:var(--accent); }
.pp-btn.accent:hover{ background:var(--accent2); }
.pp-note{ margin:12px 18px 0; padding:9px 13px; border-radius:8px; font-size:12.5px;
  background:#fff6e0; border:1px solid #e6d49a; color:#6b5a2a; display:none; }
.pp-note.show{ display:block; }
/* ── Bibliothèque ── */
.pp-lib{ padding:20px 18px 60px; }
.pp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:22px 18px; }
.pp-book{ cursor:pointer; }
.pp-cover{ position:relative; aspect-ratio:2/3; border-radius:4px 7px 7px 4px; overflow:hidden;
  background:linear-gradient(135deg,#8a7350,#5f4d34); color:#fdf8ee;
  box-shadow:0 6px 16px rgba(0,0,0,.28), inset 3px 0 0 rgba(0,0,0,.22), inset -1px 0 3px rgba(255,255,255,.15);
  transition:transform .2s, box-shadow .2s; display:flex; align-items:flex-end; }
.pp-book:hover .pp-cover{ transform:translateY(-4px) rotateY(-6deg); box-shadow:0 12px 26px rgba(0,0,0,.35); }
.pp-cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pp-cover .pp-spine{ position:absolute; left:0; top:0; bottom:0; width:6px; background:rgba(0,0,0,.25); }
.pp-cover .pp-fallback{ position:relative; z-index:1; padding:12px; font-size:14px; font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.25; }
.pp-cover .pp-menu{ position:absolute; top:6px; right:6px; z-index:3; width:28px; height:28px; border:none;
  border-radius:50%; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; font-size:15px; opacity:0; transition:.15s; }
.pp-book:hover .pp-menu{ opacity:1; }
.pp-meta{ margin-top:8px; }
.pp-meta .t{ font-size:14px; font-weight:700; line-height:1.2; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pp-meta .a{ font-size:11.5px; color:var(--ink2); margin-top:2px; }
.pp-empty{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink2); }
.pp-empty .e{ font-size:52px; display:block; margin-bottom:14px; }
.pp-empty h2{ font-size:19px; color:var(--accent); margin-bottom:6px; }
/* ── Modales ── */
.pp-modal{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  background:rgba(30,24,16,.55); backdrop-filter:blur(3px); padding:16px; }
.pp-modal.show{ display:flex; }
.pp-card{ width:min(440px,96vw); max-height:92vh; overflow-y:auto; background:var(--card);
  border-radius:14px; border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,.4); padding:20px; }
.pp-card h3{ font-size:18px; color:var(--accent); margin-bottom:14px; }
.pp-field{ margin-bottom:13px; }
.pp-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:5px; }
.pp-in,.pp-ta{ width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:inherit;
  font-size:14px; background:#fff; color:var(--ink); outline:none; }
.pp-in:focus,.pp-ta:focus{ border-color:var(--accent); }
.pp-ta{ resize:vertical; min-height:64px; }
.pp-file{ display:flex; align-items:center; gap:10px; }
.pp-filelbl{ border:1px dashed var(--line); border-radius:8px; padding:10px 14px; cursor:pointer;
  background:#fff; font-size:13px; color:var(--ink2); flex:1; text-align:center; }
.pp-filelbl:hover{ background:#f6f1e4; }
.pp-cover-prev{ width:70px; aspect-ratio:2/3; border-radius:5px; object-fit:cover; background:#e6ddc9; display:none; }
.pp-cover-prev.show{ display:block; }
.pp-row{ display:flex; gap:10px; margin-top:6px; }
.pp-row .pp-btn{ flex:1; justify-content:center; }
/* ── Lecteur ── */
.pp-reader{ position:fixed; inset:0; z-index:80; display:none; flex-direction:column;
  background:#3a332a; }
.pp-reader.show{ display:flex; }
.pp-reader.opening .pp-stage{ animation:ppOpen .7s cubic-bezier(.2,.7,.3,1); }
@keyframes ppOpen{ 0%{ transform:perspective(1400px) rotateY(-88deg); opacity:.2; transform-origin:left center; }
  100%{ transform:perspective(1400px) rotateY(0); opacity:1; } }
.pp-rtop{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:rgba(0,0,0,.35); color:#f0e9da; }
.pp-rtop .nm{ flex:1; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pp-rtop button{ border:none; background:rgba(255,255,255,.14); color:#f0e9da; cursor:pointer; border-radius:7px;
  padding:7px 11px; font-family:inherit; font-size:13px; font-weight:600; }
.pp-rtop button:hover{ background:rgba(255,255,255,.28); }
.pp-stagewrap{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:10px; }
.pp-stage{ position:relative; background:var(--card); box-shadow:0 12px 40px rgba(0,0,0,.5);
  border-radius:2px; overflow:hidden; display:flex; align-items:center; justify-content:center;
  transition:transform .2s; }
.pp-stage.ratio916{ aspect-ratio:9/16; }
.pp-stage.ratio169{ aspect-ratio:16/9; }
.pp-canvas{ display:block; max-width:100%; max-height:100%; }
.pp-flip{ position:absolute; inset:0; background:var(--card); box-shadow:0 0 30px rgba(0,0,0,.3);
  transform-origin:left center; pointer-events:none; opacity:0; }
.pp-flip.turn{ animation:ppTurn .5s ease; }
.pp-flip.turn-back{ animation:ppTurnBack .5s ease; transform-origin:right center; }
@keyframes ppTurn{ 0%{ transform:perspective(1600px) rotateY(0); opacity:1; box-shadow:2px 0 20px rgba(0,0,0,.3); }
  100%{ transform:perspective(1600px) rotateY(-170deg); opacity:1; box-shadow:-8px 0 26px rgba(0,0,0,.45); } }
@keyframes ppTurnBack{ 0%{ transform:perspective(1600px) rotateY(170deg); opacity:1; }
  100%{ transform:perspective(1600px) rotateY(0); opacity:1; } }
.pp-tap{ position:absolute; top:0; bottom:0; width:34%; z-index:5; cursor:pointer; }
.pp-tap.left{ left:0; } .pp-tap.right{ right:0; }
.pp-rbot{ display:flex; align-items:center; justify-content:center; gap:14px; padding:10px 14px;
  background:rgba(0,0,0,.35); color:#f0e9da; font-size:13px; }
.pp-rbot button{ border:none; background:rgba(255,255,255,.14); color:#f0e9da; cursor:pointer; border-radius:7px;
  width:38px; height:34px; font-size:15px; font-family:inherit; }
.pp-rbot button:hover{ background:rgba(255,255,255,.28); }
.pp-rbot .pg{ min-width:88px; text-align:center; }
.pp-spin{ color:#f0e9da; font-size:14px; }
</style>
</head>
<body>
  <div class="pp-top">
    <span class="pp-logo">📚</span>
    <div class="pp-ttl"><h1>PAPIRUS</h1><div class="s">Bibliothèque de l'équipe Zévi Marron</div></div>
    <button class="pp-btn" id="pp-home" title="Retour Olympe">🏠 Accueil</button>
    <button class="pp-btn" id="pp-settings" title="Réglages GitHub">⚙️</button>
    <button class="pp-btn accent" id="pp-add">➕ Ajouter un livre</button>
  </div>
  <div class="pp-note" id="pp-note"></div>
  <div class="pp-lib"><div class="pp-grid" id="pp-grid"></div></div>

  <!-- Ajout / édition -->
  <div class="pp-modal" id="pp-form-modal">
    <div class="pp-card">
      <h3 id="pp-form-title">Ajouter un livre</h3>
      <div class="pp-field">
        <label>Fichier PDF</label>
        <div class="pp-file"><label class="pp-filelbl" id="pp-pdf-lbl">📄 Choisir un PDF…<input type="file" id="pp-pdf" accept="application/pdf" hidden></label></div>
      </div>
      <div class="pp-field">
        <label>Couverture (image, option.)</label>
        <div class="pp-file">
          <label class="pp-filelbl" id="pp-cov-lbl">🖼️ Choisir une image…<input type="file" id="pp-cov" accept="image/*" hidden></label>
          <img class="pp-cover-prev" id="pp-cov-prev" alt="">
        </div>
      </div>
      <div class="pp-field"><label>Titre</label><input class="pp-in" id="pp-title" maxlength="90" placeholder="Titre du livre"></div>
      <div class="pp-field"><label>Auteur (option.)</label><input class="pp-in" id="pp-author" maxlength="60" placeholder="Auteur"></div>
      <div class="pp-field"><label>Description (option.)</label><textarea class="pp-ta" id="pp-desc" maxlength="400" placeholder="Résumé, notes…"></textarea></div>
      <div class="pp-row"><button class="pp-btn" id="pp-form-cancel">Annuler</button><button class="pp-btn accent" id="pp-form-save">Enregistrer</button></div>
    </div>
  </div>

  <!-- Réglages GitHub -->
  <div class="pp-modal" id="pp-set-modal">
    <div class="pp-card">
      <h3>⚙️ Sauvegarde GitHub</h3>
      <p style="font-size:12.5px;color:var(--ink2);margin-bottom:12px;line-height:1.5">Les PDF sont enregistrés dans le dossier <b>book/</b> du dépôt. Utilise un token <b>fine-grained</b> limité à ce dépôt (Contents : lecture/écriture). Le token reste sur cet appareil.</p>
      <div class="pp-field"><label>Propriétaire (owner)</label><input class="pp-in" id="pp-gh-owner" placeholder="cedricriviere33-tech"></div>
      <div class="pp-field"><label>Dépôt (repo)</label><input class="pp-in" id="pp-gh-repo" placeholder="0lympe"></div>
      <div class="pp-field"><label>Branche</label><input class="pp-in" id="pp-gh-branch" placeholder="main"></div>
      <div class="pp-field"><label>Token GitHub</label><input class="pp-in" id="pp-gh-token" type="password" placeholder="github_pat_…"></div>
      <div class="pp-row"><button class="pp-btn" id="pp-set-cancel">Fermer</button><button class="pp-btn accent" id="pp-set-save">Enregistrer</button></div>
    </div>
  </div>

  <!-- Lecteur -->
  <div class="pp-reader" id="pp-reader">
    <div class="pp-rtop">
      <span class="nm" id="pp-r-name">…</span>
      <button id="pp-r-ratio" title="Format d'affichage">9:16</button>
      <button id="pp-r-full" title="Plein écran">⛶</button>
      <button id="pp-r-close" title="Fermer">✕</button>
    </div>
    <div class="pp-stagewrap">
      <div class="pp-stage ratio916" id="pp-stage">
        <canvas class="pp-canvas" id="pp-canvas"></canvas>
        <div class="pp-flip" id="pp-flip"></div>
        <div class="pp-tap left" id="pp-tap-l"></div>
        <div class="pp-tap right" id="pp-tap-r"></div>
      </div>
    </div>
    <div class="pp-rbot">
      <button id="pp-prev" title="Page précédente">‹</button>
      <button id="pp-zoomout" title="Réduire">A−</button>
      <span class="pg" id="pp-pg">– / –</span>
      <button id="pp-zoomin" title="Agrandir">A+</button>
      <button id="pp-next" title="Page suivante">›</button>
    </div>
  </div>

<script>
(function(){
  'use strict';
  if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

  var DEFAULT_COVER='';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }

  /* ── IndexedDB (bibliothèque + PDF en cache) ── */
  var DB='papirus-db';
  function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(e){ var d=e.target.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('pdf')) d.createObjectStore('pdf'); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function idbGet(store,key){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction(store).objectStore(store).get(key); t.onsuccess=function(){ res(t.result); }; t.onerror=function(){ res(null); }; }); }); }
  function idbSet(store,key,val){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction(store,'readwrite').objectStore(store).put(val,key); t.onsuccess=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }); }
  function idbDel(store,key){ return idb().then(function(d){ return new Promise(function(res){ var t=d.transaction(store,'readwrite').objectStore(store).delete(key); t.onsuccess=function(){ res(true); }; t.onerror=function(){ res(false); }; }); }); }

  /* ── config GitHub ── */
  function gh(){ try{ return JSON.parse(localStorage.getItem('papirus_gh')||'{}')||{}; }catch(e){ return {}; } }
  function ghReady(){ var c=gh(); return !!(c.token&&c.owner&&c.repo); }
  function ghHeaders(){ var c=gh(); return { 'Authorization':'token '+c.token, 'Accept':'application/vnd.github+json' }; }
  function ghPath(path){ var c=gh(); return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+path; }
  function ghBranch(){ return gh().branch||'main'; }
  function b64ofStr(s){ return btoa(unescape(encodeURIComponent(s))); }
  function strOfB64(b){ try{ return decodeURIComponent(escape(atob(b))); }catch(e){ return atob(b); } }

  function ghGet(path){ return fetch(ghPath(path)+'?ref='+encodeURIComponent(ghBranch()),{headers:ghHeaders()})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw new Error('GET '+r.status); return r.json(); }); }
  function ghPut(path,contentB64,message,sha){ var body={ message:message, content:contentB64, branch:ghBranch() }; if(sha) body.sha=sha;
    return fetch(ghPath(path),{ method:'PUT', headers:ghHeaders(), body:JSON.stringify(body) })
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('PUT '+r.status+' '+t); }); return r.json(); }); }
  function ghDel(path,sha,message){ return fetch(ghPath(path),{ method:'DELETE', headers:ghHeaders(),
    body:JSON.stringify({ message:message, sha:sha, branch:ghBranch() }) }).then(function(r){ return r.ok; }); }

  /* ── bibliothèque ── */
  var _lib={ books:[] }, _libSha=null, _pdfCache={};
  function note(msg,show){ var n=$('pp-note'); if(!n) return; n.textContent=msg; n.classList.toggle('show',!!show); }

  function loadLibrary(){
    // cache local d'abord
    return idbGet('kv','library').then(function(cached){
      if(cached){ try{ _lib=JSON.parse(cached)||{books:[]}; }catch(e){} render(); }
      if(!ghReady()){ note('⚙️ Configure GitHub (réglages) pour partager les livres avec l\'équipe. Pour l\'instant : stockage local à cet appareil.', true); render(); return; }
      note('',false);
      return ghGet('book/library.json').then(function(f){
        if(f){ _libSha=f.sha; try{ _lib=JSON.parse(strOfB64(f.content))||{books:[]}; }catch(e){ _lib={books:[]}; } }
        else { _lib=_lib||{books:[]}; }
        idbSet('kv','library',JSON.stringify(_lib)); render();
      }).catch(function(e){ note('⚠️ GitHub inaccessible ('+e.message+'). Affichage du cache local.', true); render(); });
    });
  }
  function saveLibrary(){
    idbSet('kv','library',JSON.stringify(_lib));
    if(!ghReady()) return Promise.resolve();
    return ghGet('book/library.json').then(function(f){ _libSha=f?f.sha:null;
      return ghPut('book/library.json', b64ofStr(JSON.stringify(_lib,null,2)), 'papirus: maj bibliothèque', _libSha); })
      .then(function(res){ if(res&&res.content) _libSha=res.content.sha; })
      .catch(function(e){ note('⚠️ Sauvegarde GitHub échouée : '+e.message, true); });
  }

  function render(){
    var g=$('pp-grid'); if(!g) return;
    var books=(_lib.books||[]).slice().sort(function(a,b){ return (b.created||0)-(a.created||0); });
    if(!books.length){ g.innerHTML='<div class="pp-empty"><span class="e">📖</span><h2>Bibliothèque vide</h2>Ajoute un premier livre avec « ➕ Ajouter un livre ».</div>'; return; }
    g.innerHTML=books.map(function(bk){
      var cov = bk.cover ? '<img src="'+esc(bk.cover)+'" alt="">' : '<span class="pp-fallback">'+esc(bk.title||'Livre')+'</span>';
      return '<div class="pp-book" data-id="'+esc(bk.id)+'">'
        +'<div class="pp-cover"><span class="pp-spine"></span>'+cov
          +'<button class="pp-menu" data-act="menu" data-id="'+esc(bk.id)+'">⋯</button></div>'
        +'<div class="pp-meta"><div class="t">'+esc(bk.title||'Sans titre')+'</div>'
          +(bk.author?'<div class="a">'+esc(bk.author)+'</div>':'')+'</div></div>';
    }).join('');
  }

  /* ── compression image couverture ── */
  function compress(file,cb){ try{ var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){ var max=520,w=img.width,h=img.height; if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>max){w=Math.round(w*max/h);h=max;}
      var c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      try{URL.revokeObjectURL(u);}catch(e){} var o; try{o=c.toDataURL('image/jpeg',0.78);}catch(e){o=null;} cb(o); };
    img.onerror=function(){ try{URL.revokeObjectURL(u);}catch(e){} cb(null); }; img.src=u;
  }catch(e){ cb(null); } }
  function fileToB64(file){ return new Promise(function(res,rej){ var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(',')[1]); }; r.onerror=function(){ rej(r.error); }; r.readAsDataURL(file); }); }

  /* ── formulaire ── */
  var _editId=null, _pdfFile=null, _coverData=null;
  function openForm(book){
    _editId = book?book.id:null; _pdfFile=null; _coverData=book?book.cover:null;
    $('pp-form-title').textContent = book?'Modifier le livre':'Ajouter un livre';
    $('pp-title').value=book?(book.title||''):''; $('pp-author').value=book?(book.author||''):''; $('pp-desc').value=book?(book.desc||''):'';
    $('pp-pdf-lbl').innerHTML = (book?'📄 PDF déjà enregistré (remplacer…)':'📄 Choisir un PDF…')+'<input type="file" id="pp-pdf" accept="application/pdf" hidden>';
    $('pp-pdf').addEventListener('change', onPdfPick);
    var cp=$('pp-cov-prev'); if(_coverData){ cp.src=_coverData; cp.classList.add('show'); } else cp.classList.remove('show');
    $('pp-form-modal').classList.add('show');
  }
  function onPdfPick(e){ _pdfFile=e.target.files&&e.target.files[0]; if(_pdfFile){ $('pp-pdf-lbl').firstChild.textContent='📄 '+_pdfFile.name; } }
  function onCovPick(e){ var f=e.target.files&&e.target.files[0]; if(!f) return; compress(f,function(d){ if(d){ _coverData=d; var cp=$('pp-cov-prev'); cp.src=d; cp.classList.add('show'); } }); }
  function closeForm(){ $('pp-form-modal').classList.remove('show'); }

  function saveBook(){
    var title=($('pp-title').value||'').trim();
    if(!title){ alert('Donne un titre au livre.'); return; }
    if(!_editId && !_pdfFile){ alert('Choisis un fichier PDF.'); return; }
    var btn=$('pp-form-save'); btn.disabled=true; btn.textContent='Enregistrement…';
    var id=_editId||uuid();
    var pdfPath='book/'+id+'.pdf';
    var book = _editId ? (_lib.books.filter(function(b){return b.id===id;})[0]||{id:id}) : { id:id, created:Date.now(), pdf:pdfPath };
    book.title=title; book.author=($('pp-author').value||'').trim(); book.desc=($('pp-desc').value||'').trim(); book.cover=_coverData||book.cover||null;
    book.pdf=book.pdf||pdfPath;

    var chain=Promise.resolve();
    if(_pdfFile){
      chain=fileToB64(_pdfFile).then(function(b64){
        return idbSet('pdf', id, b64).then(function(){
          if(ghReady()){ return ghGet(pdfPath).then(function(f){ return ghPut(pdfPath, b64, 'papirus: '+(_editId?'maj':'ajout')+' PDF '+title, f?f.sha:null); }); }
        });
      });
    }
    chain.then(function(){
      if(!_editId) _lib.books.push(book);
      else _lib.books=_lib.books.map(function(b){ return b.id===id?book:b; });
      return saveLibrary();
    }).then(function(){
      btn.disabled=false; btn.textContent='Enregistrer'; closeForm(); render();
    }).catch(function(e){ btn.disabled=false; btn.textContent='Enregistrer'; alert('Erreur : '+e.message); });
  }

  function delBook(id){
    var book=_lib.books.filter(function(b){return b.id===id;})[0]; if(!book) return;
    if(!confirm('Supprimer « '+(book.title||'ce livre')+' » ?')) return;
    _lib.books=_lib.books.filter(function(b){ return b.id!==id; });
    idbDel('pdf', id);
    saveLibrary().then(function(){
      if(ghReady()){ ghGet(book.pdf).then(function(f){ if(f) ghDel(book.pdf, f.sha, 'papirus: suppr PDF'); }); }
    });
    render();
  }

  /* ── lecteur PDF ── */
  var _doc=null, _page=1, _pages=1, _scale=1.0, _rendering=false;
  function getPdfData(book){
    if(_pdfCache[book.id]) return Promise.resolve(_pdfCache[book.id]);
    return idbGet('pdf', book.id).then(function(local){
      if(local){ _pdfCache[book.id]=local; return local; }
      if(ghReady()){ return ghGet(book.pdf).then(function(f){ if(f){ var b=f.content.replace(/\n/g,''); _pdfCache[book.id]=b; idbSet('pdf',book.id,b); return b; } return null; }); }
      return null;
    });
  }
  function b64ToUint8(b64){ var bin=atob(b64); var len=bin.length; var arr=new Uint8Array(len); for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i); return arr; }

  function openReader(id){
    var book=_lib.books.filter(function(b){return b.id===id;})[0]; if(!book) return;
    if(!window.pdfjsLib){ alert('Lecteur PDF non chargé (réseau requis au 1er lancement).'); return; }
    $('pp-r-name').textContent=book.title||'Livre';
    var rd=$('pp-reader'); rd.classList.add('show'); rd.classList.add('opening');
    setTimeout(function(){ rd.classList.remove('opening'); },720);
    $('pp-pg').textContent='… / …';
    getPdfData(book).then(function(b64){
      if(!b64){ alert('PDF introuvable. Vérifie la connexion / GitHub.'); closeReader(); return; }
      return pdfjsLib.getDocument({ data:b64ToUint8(b64) }).promise.then(function(doc){
        _doc=doc; _pages=doc.numPages; _page=1; _scale=1.0; renderPage();
      });
    }).catch(function(e){ alert('Ouverture impossible : '+e.message); closeReader(); });
  }
  function renderPage(dir){
    if(!_doc||_rendering) return; _rendering=true;
    _doc.getPage(_page).then(function(page){
      var stage=$('pp-stage'), cv=$('pp-canvas'), ctx=cv.getContext('2d');
      var vp0=page.getViewport({scale:1});
      var box=stage.getBoundingClientRect();
      var fit=Math.min(box.width/vp0.width, box.height/vp0.height);
      var vp=page.getViewport({ scale:fit*_scale*(window.devicePixelRatio||1) });
      cv.width=vp.width; cv.height=vp.height;
      cv.style.width=(vp.width/(window.devicePixelRatio||1))+'px'; cv.style.height=(vp.height/(window.devicePixelRatio||1))+'px';
      return page.render({ canvasContext:ctx, viewport:vp }).promise;
    }).then(function(){
      _rendering=false; $('pp-pg').textContent=_page+' / '+_pages;
      if(dir){ var fl=$('pp-flip'); fl.className='pp-flip'; void fl.offsetWidth; fl.classList.add(dir>0?'turn':'turn-back'); }
    }).catch(function(){ _rendering=false; });
  }
  function turn(d){ var n=_page+d; if(n<1||n>_pages||_rendering) return; _page=n; renderPage(d); }
  function zoom(d){ _scale=Math.max(0.6,Math.min(3,_scale+d)); renderPage(); }
  function closeReader(){ $('pp-reader').classList.remove('show'); _doc=null; }
  function toggleRatio(){ var st=$('pp-stage'), b=$('pp-r-ratio');
    if(st.classList.contains('ratio916')){ st.classList.remove('ratio916'); st.classList.add('ratio169'); b.textContent='16:9'; }
    else { st.classList.remove('ratio169'); st.classList.add('ratio916'); b.textContent='9:16'; }
    setTimeout(function(){ renderPage(); },210); }
  function toggleFull(){ var el=$('pp-reader'); try{ if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }catch(e){} }

  /* ── settings ── */
  function openSettings(){ var c=gh(); $('pp-gh-owner').value=c.owner||'cedricriviere33-tech'; $('pp-gh-repo').value=c.repo||'0lympe';
    $('pp-gh-branch').value=c.branch||'main'; $('pp-gh-token').value=c.token||''; $('pp-set-modal').classList.add('show'); }
  function saveSettings(){ var c={ owner:($('pp-gh-owner').value||'').trim(), repo:($('pp-gh-repo').value||'').trim(),
    branch:($('pp-gh-branch').value||'main').trim(), token:($('pp-gh-token').value||'').trim() };
    localStorage.setItem('papirus_gh', JSON.stringify(c)); $('pp-set-modal').classList.remove('show'); loadLibrary(); }

  /* ── accueil Olympe ── */
  function goHome(){ try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'olympe-close-app'},'*'); return; } }catch(e){} try{ window.location.href='/'; }catch(e){} }

  /* ── câblage ── */
  function wire(){
    $('pp-add').addEventListener('click', function(){ openForm(null); });
    $('pp-home').addEventListener('click', goHome);
    $('pp-settings').addEventListener('click', openSettings);
    $('pp-form-cancel').addEventListener('click', closeForm);
    $('pp-form-save').addEventListener('click', saveBook);
    $('pp-cov').addEventListener('change', onCovPick);
    $('pp-set-cancel').addEventListener('click', function(){ $('pp-set-modal').classList.remove('show'); });
    $('pp-set-save').addEventListener('click', saveSettings);
    $('pp-grid').addEventListener('click', function(e){
      var m=e.target.closest('[data-act="menu"]');
      if(m){ e.stopPropagation(); var id=m.getAttribute('data-id');
        var book=_lib.books.filter(function(b){return b.id===id;})[0];
        var choice=prompt('Livre « '+(book?book.title:'')+' »\nTape :  M = modifier   S = supprimer','M');
        if(choice==null) return; choice=choice.trim().toUpperCase();
        if(choice==='M') openForm(book); else if(choice==='S') delBook(id);
        return; }
      var bk=e.target.closest('.pp-book'); if(bk) openReader(bk.getAttribute('data-id'));
    });
    $('pp-r-close').addEventListener('click', closeReader);
    $('pp-r-ratio').addEventListener('click', toggleRatio);
    $('pp-r-full').addEventListener('click', toggleFull);
    $('pp-prev').addEventListener('click', function(){ turn(-1); });
    $('pp-next').addEventListener('click', function(){ turn(1); });
    $('pp-tap-l').addEventListener('click', function(){ turn(-1); });
    $('pp-tap-r').addEventListener('click', function(){ turn(1); });
    $('pp-zoomin').addEventListener('click', function(){ zoom(0.2); });
    $('pp-zoomout').addEventListener('click', function(){ zoom(-0.2); });
    document.addEventListener('keydown', function(e){
      if(!$('pp-reader').classList.contains('show')) return;
      if(e.key==='ArrowRight') turn(1); else if(e.key==='ArrowLeft') turn(-1);
      else if(e.key==='Escape'){ if(document.fullscreenElement){} else closeReader(); }
    });
    window.addEventListener('resize', function(){ if($('pp-reader').classList.contains('show')) renderPage(); });
  }

  wire();
  loadLibrary();
})();
</script>
</body>
</html>
