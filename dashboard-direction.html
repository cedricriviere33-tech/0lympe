<style>
:root{
  --lp-yellow:#FFCC00; --lp-blue:#003189; --lp-blue2:#0056b3; --ink:#1a1f2e; --ink2:#5b6472;
  --bg:#eef1f6; --card:#ffffff; --line:#e2e7ef;
  --prio:#0071e3; --eco:#34a853; --ppi:#8e44ad; --sac:#e8850e; --cab:#d4145a; --mrd:#c0392b;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ── Login ── */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#003189,#0056b3);}
.lg-card{background:#fff;border-radius:18px;padding:38px 34px;width:min(380px,90vw);box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center;}
.lg-logo{width:64px;height:64px;border-radius:16px;background:var(--lp-yellow);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px;font-weight:900;color:var(--lp-blue);}
.lg-card h1{font-size:19px;color:var(--lp-blue);margin-bottom:4px;}
.lg-card p{font-size:12.5px;color:var(--ink2);margin-bottom:22px;}
.lg-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:12px;font-family:inherit;}
.lg-card input:focus{outline:none;border-color:var(--lp-blue);}
.lg-card button{width:100%;padding:13px;border:none;border-radius:11px;background:var(--lp-blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.lg-card button:hover{background:#00256b;}
.lg-err{color:#c0392b;font-size:12.5px;margin-top:10px;min-height:16px;}

/* ── App ── */
#app{display:none;max-width:1280px;margin:0 auto;padding:0 18px 60px;}
header{position:sticky;top:0;z-index:20;background:var(--lp-blue);color:#fff;margin:0 -18px 20px;padding:14px 22px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(0,0,0,.18);}
.hd-logo{width:40px;height:40px;border-radius:10px;background:var(--lp-yellow);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--lp-blue);font-size:20px;flex-shrink:0;}
.hd-t{line-height:1.2;}
.hd-t b{font-size:16px;display:block;}
.hd-t span{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;}
.hd-sp{flex:1;}
.hd-live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;}
.hd-live i{width:9px;height:9px;border-radius:50%;background:#39d98a;animation:pulse 1.6s infinite;}
.hd-live.off i{background:#e8850e;animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hd-date input{padding:7px 11px;border:none;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;color:var(--lp-blue);}
.hd-btn{padding:8px 14px;border:none;border-radius:9px;background:var(--lp-yellow);color:var(--lp-blue);font-weight:800;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.hd-btn.ghost{background:rgba(255,255,255,.14);color:#fff;}
.hd-btn:hover{filter:brightness(1.05);}

.sec-t{font-size:13px;font-weight:800;color:var(--lp-blue);text-transform:uppercase;letter-spacing:1px;margin:26px 4px 12px;display:flex;align-items:center;gap:9px;}
.sec-t::before{content:'';width:4px;height:16px;background:var(--lp-yellow);border-radius:2px;}

/* KPI grid */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(20,40,90,.06);border-top:3px solid var(--ac,var(--lp-blue));position:relative;overflow:hidden;}
.kpi .k-l{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;}
.kpi .k-v{font-size:30px;font-weight:800;color:var(--ac,var(--lp-blue));line-height:1.1;margin-top:6px;}
.kpi .k-s{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600;}
.kpi .k-ic{position:absolute;right:14px;top:14px;font-size:22px;opacity:.18;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:820px){.grid2{grid-template-columns:1fr;}}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(20,40,90,.06);}
.card h3{font-size:14px;color:var(--lp-blue);margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.card h3 .cnt{background:var(--lp-blue);color:#fff;font-size:12px;padding:2px 10px;border-radius:20px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 8px;border-bottom:2px solid var(--line);}
td{padding:8px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.badge{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;}
.b-ok{background:#e6f7ee;color:#1a7f3c;} .b-warn{background:#fff4e0;color:#a5670a;} .b-dang{background:#fdeaea;color:#b3261e;}
.empty{color:var(--ink2);font-size:12.5px;text-align:center;padding:24px;}
.chart-wrap{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(20,40,90,.06);}
.chart-wrap canvas{max-height:320px;}
.chart-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.chart-tabs button{padding:6px 13px;border:1.5px solid var(--line);background:#fff;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2);}
.chart-tabs button.on{background:var(--lp-blue);color:#fff;border-color:var(--lp-blue);}
.foot{text-align:center;color:var(--ink2);font-size:11px;margin-top:30px;}

/* Détail + KPI mis en avant */
.kpi{padding-bottom:38px;}
.kpi .k-det{position:absolute;right:14px;bottom:11px;background:rgba(0,49,137,.07);border:none;color:var(--lp-blue);font-size:11px;font-weight:700;padding:4px 11px;border-radius:8px;cursor:pointer;}
.kpi .k-det:hover{background:rgba(0,49,137,.15);}
.kpi-big{grid-column:1/-1;background:linear-gradient(120deg,#003189,#0056b3);}
.kpi-big .k-l{color:rgba(255,255,255,.85);}
.kpi-big .k-v{color:#fff!important;font-size:38px;}
.kpi-big .k-s{color:rgba(255,255,255,.92);}
.kpi-big .k-ic{opacity:.28;font-size:30px;}
.kpi-big .k-det{background:rgba(255,255,255,.18);color:#fff;}
.kpi-big .k-det:hover{background:rgba(255,255,255,.3);}

/* Popup macOS */
.dd-ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.dd-ov.on{display:flex;}
.dd-card{width:min(720px,95vw);max-height:88vh;background:#ececf0;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.42);display:flex;flex-direction:column;overflow:hidden;}
.dd-bar{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 16px;background:linear-gradient(180deg,#fbfbfd,#f2f2f5);border-bottom:.5px solid rgba(0,0,0,.08);}
.dd-ttl{font-size:15px;font-weight:700;color:#1a1f2e;text-align:center;padding:0 40px;}
.dd-x{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.06);color:#6e6e73;cursor:pointer;font-size:14px;}
.dd-x:hover{background:rgba(0,0,0,.12);}
.dd-body{padding:16px 18px;overflow-y:auto;}
.dd-body table{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.dd-body th{background:#f7f8fb;}
.dd-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.dd-sum .p{background:#fff;border-radius:11px;padding:11px 15px;flex:1;min-width:100px;box-shadow:0 1px 5px rgba(0,0,0,.06);}
.dd-sum .p b{display:block;font-size:22px;color:var(--lp-blue);line-height:1.1;}
.dd-sum .p span{font-size:10.5px;color:var(--ink2);text-transform:uppercase;font-weight:700;letter-spacing:.3px;}

@media print{
  body{background:#fff;}
  header{position:static;background:#fff!important;color:var(--lp-blue)!important;box-shadow:none;border-bottom:2px solid var(--lp-blue);}
  .hd-btn,.hd-date,.hd-live,.chart-tabs,.no-print{display:none!important;}
  .kpi,.card,.chart-wrap{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  #app{max-width:100%;}
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login">
  <div class="lg-card">
    <div class="lg-logo">📮</div>
    <h1>PIC Gillot Import</h1>
    <p>Tableau de bord Direction · Lecture seule</p>
    <input type="text" id="lg-id" placeholder="Identifiant" autocomplete="off">
    <input type="password" id="lg-pw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Se connecter</button>
    <div class="lg-err" id="lg-err"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <header>
    <div class="hd-logo">📮</div>
    <div class="hd-t"><b>PIC Gillot Import</b><span>Activité du jour · Direction</span></div>
    <div class="hd-sp"></div>
    <div class="hd-live" id="live"><i></i><span id="live-t">Connexion…</span></div>
    <div class="hd-date"><input type="date" id="the-date" onchange="onDateChange()"></div>
    <button class="hd-btn ghost" onclick="showHistorique()">🗂 Historique</button>
    <button class="hd-btn" onclick="window.print()">🖨 Imprimer / PDF</button>
    <button class="hd-btn ghost" onclick="reloadAll()">↻ Actualiser</button>
    <button class="hd-btn ghost" onclick="logout()">Quitter</button>
  </header>

  <div class="sec-t">✈️ Hermès — Import Opérations</div>
  <div class="kgrid" id="k-hermes"></div>

  <div class="sec-t">📊 Volumes du jour</div>
  <div class="kgrid" id="k-volumes"></div>

  <div class="sec-t">📈 Graphique</div>
  <div class="chart-wrap">
    <div class="chart-tabs" id="chart-tabs"></div>
    <canvas id="chart"></canvas>
  </div>

  <div class="sec-t">🔧 Suivi qualité</div>
  <div class="grid2">
    <div class="card">
      <h3>Registre VGP — Incidents équipements <span class="cnt" id="vgp-cnt">0</span></h3>
      <div id="vgp-body"></div>
    </div>
    <div class="card">
      <h3>Anomalies colis <span class="cnt" id="ano-cnt">0</span></h3>
      <div id="ano-body"></div>
    </div>
  </div>

  <div class="sec-t">🗂 Historique récent</div>
  <div class="card"><div id="histo-body"></div></div>

  <div class="foot" id="foot">—</div>
</div>

<!-- ═══ POPUP macOS (détail / historique) ═══ -->
<div id="dd-modal" class="dd-ov">
  <div class="dd-card">
    <div class="dd-bar"><div class="dd-ttl" id="dd-ttl"></div><button class="dd-x" onclick="closeModal()">✕</button></div>
    <div class="dd-body" id="dd-body"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Tableau de bord Direction — PIC Gillot Import
   Lecture seule. Se connecte au MÊME Supabase qu'Olympe.
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';

// ── Config (identique à olympe-config.js) ──
var CFG = {
  url: 'https://eedvljmmvsxrcwhclfpg.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlZHZsam1tdnN4cmN3aGNsZnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0OTgzMDcsImV4cCI6MjEwMDA3NDMwN30.Tmf3pchljBcjHpg5NzyJFA_gQPuYiKZqfwTjEYG5krA',
  emailDomain: '0lympe.local'
};

var SB = null, _rows = [], _chart = null, _chartMode = 'volumes', _sub = null, _rt = null;

function todayKey(dt){ var d = dt ? new Date(dt+'T12:00:00') : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function selDate(){ var e = document.getElementById('the-date'); return (e && e.value) ? e.value : todayKey(); }
function n(x){ var v = parseFloat(x); return isNaN(v) ? 0 : v; }
function fmt(x){ return (Math.round(n(x)*10)/10).toLocaleString('fr-FR'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ── Login gate ── */
function doLogin(){
  var id = document.getElementById('lg-id').value.trim();
  var pw = document.getElementById('lg-pw').value;
  if (!id || !pw){ document.getElementById('lg-err').textContent = 'Entre ton identifiant et ton mot de passe.'; return; }
  document.getElementById('lg-err').textContent = 'Connexion au serveur…';
  connect(id, pw);
}
function logout(){ try{ if(SB) SB.auth.signOut(); }catch(e){} location.reload(); }

/* ── Connexion Supabase (lecture seule) ── */
function connect(id, pw){
  try { SB = window.supabase.createClient(CFG.url, CFG.anonKey, { auth:{ persistSession:true } }); }
  catch(e){ document.getElementById('lg-err').textContent = 'Erreur SDK Supabase.'; return; }
  var email = (id.indexOf('@') >= 0) ? id : (id + '@' + CFG.emailDomain);
  SB.auth.signInWithPassword({ email: email, password: pw }).then(function(r){
    if (r.error){ document.getElementById('lg-err').textContent = 'Identifiant ou mot de passe incorrect.'; return; }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (!document.getElementById('the-date').value) document.getElementById('the-date').value = todayKey();
    reloadAll();
    subscribeRealtime();
  }).catch(function(e){ document.getElementById('lg-err').textContent = 'Erreur réseau : ' + (e && e.message || e); });
}
function setLive(ok, txt){ var el = document.getElementById('live'); if(!el) return; el.classList.toggle('off', !ok); document.getElementById('live-t').textContent = txt; }

/* ── Realtime ── */
function subscribeRealtime(){
  try {
    _sub = SB.channel('direction-dash')
      .on('postgres_changes', { event:'*', schema:'public', table:'olympe_entry' }, function(){
        clearTimeout(_rt); _rt = setTimeout(reloadAll, 500);
      })
      .subscribe(function(st){
        if (st === 'SUBSCRIBED') setLive(true, 'En direct');
        else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setLive(false, 'Reconnexion…');
      });
  } catch(e){ setLive(false, 'Hors-ligne'); }
}

/* ── Chargement + reconstruction (mêmes adaptateurs qu'Olympe) ── */
function reloadAll(){
  if (!SB) return;
  SB.from('olympe_entry').select('scope,entry_id,payload').then(function(r){
    if (r.error){ setLive(false, 'Erreur lecture'); console.error(r.error); return; }
    _rows = r.data || [];
    render();
    var now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('foot').textContent = 'Dernière actualisation : ' + now + ' · Lecture seule · PIC Gillot Import';
  });
}
// Reconstruit un scope à partir des lignes olympe_entry
function scopeObj(scope){
  var map = {};
  _rows.forEach(function(r){ if (r.scope === scope) map[r.entry_id] = r.payload; });
  if (scope === 'hermes_gillot_v4'){
    var o = {}; if (map._root && typeof map._root === 'object') Object.assign(o, map._root);
    o.dates = {}; Object.keys(map).forEach(function(k){ if (k.indexOf('d:') === 0) o.dates[k.slice(2)] = map[k]; });
    return o;
  }
  if (scope === 'olympe_mrd_releve_v1'){
    var entries = []; Object.keys(map).forEach(function(k){ if (k.indexOf('e:') === 0 && map[k]) entries.push(map[k]); });
    return { entries: entries };
  }
  if (map.hasOwnProperty('_all')) return map._all;
  return map;
}

/* ═══ Calculs KPI ═══ */
function briefTotaux(brief){
  var t = { cq:0,cpk:0,ceq:0,cepk:0,rq:0,rpk:0,pq:0,ppk:0,ppiq:0,ppipk:0,pcq:0,pcpk:0,pk:0,uld:0,deb:0,enc:0,trait:0,mrdNon:0 };
  (brief||[]).forEach(function(r){
    t.cq+=n(r.cq); t.cpk+=n(r.cpk); t.ceq+=n(r.ceq); t.cepk+=n(r.cepk);
    t.rq+=n(r.rq); t.rpk+=n(r.rpk); t.pq+=n(r.pq); t.ppk+=n(r.ppk);
    t.ppiq+=n(r.ppiq); t.ppipk+=n(r.ppipk); t.pcq+=n(r.pcq); t.pcpk+=n(r.pcpk); t.pk+=n(r.pk);
    t.uld++;
    if(r.st==='Debarque')t.deb++; else if(r.st==='En cours')t.enc++; else if(r.st==='Traite')t.trait++;
    if(r.mr==='NON')t.mrdNon++;
  });
  return t;
}
// Brief du jour = entrées dont la date effective (r.dt||cléJour) == d
function briefForDay(H, d){
  var out = []; var days = (H && H.dates) || {};
  Object.keys(days).forEach(function(bk){
    ((days[bk] && days[bk].brief) || []).forEach(function(r){
      var eff = (r && r.dt) ? r.dt : bk; if (eff === d) out.push(r);
    });
  });
  return out;
}
function sumHisto(raw, d, pick){
  var acc = { total:0, poids:0, prio:0, eco:0, vols:0 };
  Object.keys(raw||{}).forEach(function(k){
    if (k.slice(0,10) !== d) return; var v = raw[k]; if (!v || typeof v !== 'object') return;
    pick(v, acc);
  });
  return acc;
}

/* ═══ RENDER ═══ */
function render(){
  var d = selDate();
  var H = scopeObj('hermes_gillot_v4');
  var t = briefTotaux(briefForDay(H, d));

  // ── Hermès KPIs ──
  var totVol = t.cq+t.ceq+t.rq+t.pq+t.ppiq+t.pcq;
  var totPds = t.cpk+t.cepk+t.rpk+t.ppk+t.ppipk+t.pcpk;
  var kh = [
    { id:'h-total', l:'Total Hermès', v:totVol, s:fmt(totPds)+' kg · '+t.uld+' ULD', ac:'var(--lp-blue)', ic:'✈️', big:true },
    { id:'h-prio', l:'Colis PRIO', v:t.cq, s:fmt(t.cpk)+' kg', ac:'var(--prio)', ic:'📦' },
    { id:'h-eco', l:'Colis ECO', v:t.ceq, s:fmt(t.cepk)+' kg', ac:'var(--eco)', ic:'📦' },
    { id:'h-roissy', l:'Roissy', v:t.rq, s:fmt(t.rpk)+' kg', ac:'#0056b3', ic:'✈️' },
    { id:'h-presse', l:'Presse', v:t.pq, s:fmt(t.ppk)+' kg', ac:'#7a5195', ic:'📰' },
    { id:'h-ppib', l:'PPI (brief)', v:t.ppiq, s:fmt(t.ppipk)+' kg', ac:'var(--ppi)', ic:'🌍' },
    { id:'h-palc', l:'Pal. Courrier', v:t.pcq, s:fmt(t.pcpk)+' kg', ac:'#e8850e', ic:'🚚' },
    { id:'h-uld', l:'ULD du jour', v:t.uld, s:t.enc+' en cours · '+t.deb+' débarqués', ac:'var(--lp-blue)', ic:'🛢' },
    { id:'h-mrdnon', l:'MRD non faits', v:t.mrdNon, s:'depuis le brief', ac:'var(--mrd)', ic:'⚠️' }
  ];
  document.getElementById('k-hermes').innerHTML = kh.map(kpiHtml).join('');

  // ── Volumes du jour (autres modules) ──
  var ppiH = scopeObj('olympe_histo_ppi');
  var sacH = scopeObj('olympe_histo_sac');
  var cabH = scopeObj('olympe_histo_cabine');
  var mrd  = scopeObj('olympe_mrd_releve_v1');

  var ppi = sumHisto(ppiH, d, function(v,a){ a.total += (typeof v.total==='number'? v.total : (n(v.oo)+n(v.os)+n(v.cp)+n(v.sing))); a.poids += n(v.poids||v.pk||v.kg); });
  var sac = sumHisto(sacH, d, function(v,a){ var tt = (v.total!=null? n(v.total) : n(v.prio)+n(v.eco)); a.total += tt; a.prio += n(v.prio); a.eco += n(v.eco);
    // Poids PLEIN : somme des poids réels de chaque sac (detail), pas le sac vide
    if (Array.isArray(v.detail)) v.detail.forEach(function(s){ a.poids += n(s.poids); }); });
  sac.poids = Math.round(sac.poids*10)/10;
  var cab = sumHisto(cabH, d, function(v,a){ a.vols += n(v.vols); a.poids += n(v.poids); });
  cab.poids = Math.round(cab.poids*10)/10;
  var mrdDay = (mrd.entries||[]).filter(function(e){ return e && (String(e.ts||'').slice(0,10) === d); }).length;
  var mrdTot = (mrd.entries||[]).length;

  window._dayData = { t:t, ppi:ppi, sac:sac, cab:cab, mrdDay:mrdDay };
  window._dayRaw = { brief:briefForDay(H,d), ppiH:ppiH, sacH:sacH, cabH:cabH, mrd:mrd, d:d, t:t, ppi:ppi, sac:sac, cab:cab };

  var kv = [
    { id:'v-ppi', l:'PPI flashés', v:ppi.total, s:ppi.poids? fmt(ppi.poids)+' kg' : 'total du jour', ac:'var(--ppi)', ic:'🌍' },
    { id:'v-sac', l:'Sacs CP84', v:sac.total, s:fmt(sac.poids)+' kg · '+sac.prio+' PRIO / '+sac.eco+' ECO', ac:'var(--sac)', ic:'🎒' },
    { id:'v-cab', l:'Cabine Rouge', v:cab.vols, s:fmt(cab.poids)+' kg', ac:'var(--cab)', ic:'📌' },
    { id:'v-mrd', l:'MRD relevés', v:mrdDay, s:mrdTot+' au total (cumul)', ac:'var(--mrd)', ic:'📋' }
  ];
  document.getElementById('k-volumes').innerHTML = kv.map(kpiHtml).join('');

  renderVGP(d); renderAno(d); renderHisto(d); renderChart();
}
function kpiHtml(k){
  return '<div class="kpi'+(k.big?' kpi-big':'')+'" style="--ac:'+k.ac+'"><div class="k-ic">'+k.ic+'</div>'
    + '<div class="k-l">'+esc(k.l)+'</div><div class="k-v">'+fmt(k.v)+'</div><div class="k-s">'+esc(k.s)+'</div>'
    + (k.id ? '<button class="k-det" onclick="showDetail(\''+k.id+'\')">Détail ›</button>' : '')
    + '</div>';
}

/* ── VGP ── */
function renderVGP(d){
  var list = scopeObj('olympe_vgp_list'); if (!Array.isArray(list)) list = [];
  document.getElementById('vgp-cnt').textContent = list.length;
  if (!list.length){ document.getElementById('vgp-body').innerHTML = '<div class="empty">Aucun incident enregistré.</div>'; return; }
  var rows = list.slice().reverse().slice(0,8).map(function(v){
    var dt = v.date || v.ts || v.dt || ''; var st = (v.statut||v.status||v.etat||'').toLowerCase();
    var b = st.indexOf('rés')>=0||st.indexOf('clos')>=0||st.indexOf('ok')>=0 ? 'b-ok' : (st.indexOf('cours')>=0?'b-warn':'b-dang');
    return '<tr><td>'+esc(String(dt).slice(0,10))+'</td><td>'+esc(v.equipement||v.materiel||v.libelle||v.type||'—')+'</td><td>'+esc((v.desc||v.description||v.detail||'').slice(0,60))+'</td><td><span class="badge '+b+'">'+esc(v.statut||v.status||v.etat||'—')+'</span></td></tr>';
  }).join('');
  document.getElementById('vgp-body').innerHTML = '<table><tr><th>Date</th><th>Équipement</th><th>Détail</th><th>Statut</th></tr>'+rows+'</table>';
}
/* ── Anomalie ── */
function renderAno(d){
  var list = scopeObj('olympe_ano_list'); if (!Array.isArray(list)) list = [];
  document.getElementById('ano-cnt').textContent = list.length;
  if (!list.length){ document.getElementById('ano-body').innerHTML = '<div class="empty">Aucune anomalie enregistrée.</div>'; return; }
  var rows = list.slice().reverse().slice(0,8).map(function(v){
    var dt = v.date || v.ts || v.dt || ''; var st = (v.statut||v.status||v.etat||'').toLowerCase();
    var b = st.indexOf('trait')>=0||st.indexOf('clos')>=0||st.indexOf('résol')>=0 ? 'b-ok' : (st.indexOf('cours')>=0?'b-warn':'b-dang');
    return '<tr><td>'+esc(String(dt).slice(0,10))+'</td><td>'+esc(v.colis||v.ref||v.numero||v.libelle||'—')+'</td><td>'+esc((v.motif||v.desc||v.description||v.type||'').slice(0,60))+'</td><td><span class="badge '+b+'">'+esc(v.statut||v.status||v.etat||'—')+'</span></td></tr>';
  }).join('');
  document.getElementById('ano-body').innerHTML = '<table><tr><th>Date</th><th>Colis/Réf</th><th>Motif</th><th>Statut</th></tr>'+rows+'</table>';
}
/* ── Historique récent (multi-modules) ── */
function renderHisto(d){
  var sources = [
    { key:'olympe_histo_ppi', label:'PPI', pick:function(v){ return (typeof v.total==='number'?v.total:(n(v.oo)+n(v.os)+n(v.cp)+n(v.sing)))+' PPI'; } },
    { key:'olympe_histo_sac', label:'Sac CP84', pick:function(v){ return (v.total!=null?v.total:(n(v.prio)+n(v.eco)))+' sacs'; } },
    { key:'olympe_histo_cabine', label:'Cabine', pick:function(v){ return n(v.vols)+' vols · '+fmt(v.poids)+' kg'; } },
    { key:'olympe_histo_anomalie', label:'Anomalie', pick:function(v){ return (v.total||v.n||'')+' '; } }
  ];
  var all = [];
  sources.forEach(function(s){
    var raw = scopeObj(s.key); if (!raw || typeof raw !== 'object') return;
    Object.keys(raw).forEach(function(k){
      var v = raw[k]; if (!v || typeof v !== 'object') return;
      all.push({ k:k, ts:String(k).slice(0,16).replace('_',' '), label:s.label, val:s.pick(v) });
    });
  });
  all.sort(function(a,b){ return String(b.k).localeCompare(String(a.k)); });
  all = all.slice(0,15);
  if (!all.length){ document.getElementById('histo-body').innerHTML = '<div class="empty">Aucun historique.</div>'; return; }
  document.getElementById('histo-body').innerHTML = '<table><tr><th>Horodatage</th><th>Module</th><th>Détail</th></tr>'
    + all.map(function(x){ return '<tr><td>'+esc(x.ts.replace('h',':'))+'</td><td><b style="color:var(--lp-blue)">'+esc(x.label)+'</b></td><td>'+esc(x.val)+'</td></tr>'; }).join('') + '</table>';
}

/* ── Graphique ── */
function renderChart(){
  var tabs = [
    { id:'volumes', label:'Volumes du jour' },
    { id:'hermes', label:'Hermès (colis)' },
    { id:'poids', label:'Poids (kg)' }
  ];
  document.getElementById('chart-tabs').innerHTML = tabs.map(function(t){ return '<button class="'+(t.id===_chartMode?'on':'')+'" onclick="setChart(\''+t.id+'\')">'+t.label+'</button>'; }).join('');
  var dd = window._dayData || {}; var t = dd.t||{}, ppi=dd.ppi||{}, sac=dd.sac||{}, cab=dd.cab||{};
  var labels, data, colors, title;
  if (_chartMode === 'hermes'){
    labels = ['Colis PRIO','Colis ECO','Roissy','Presse','PPI','Pal. Courrier'];
    data = [t.cq,t.ceq,t.rq,t.pq,t.ppiq,t.pcq];
    colors = ['#0071e3','#34a853','#0056b3','#7a5195','#8e44ad','#e8850e']; title='Colis / contenants (Hermès)';
  } else if (_chartMode === 'poids'){
    labels = ['Colis PRIO','Colis ECO','Sacs CP84','Cabine','PPI'];
    data = [t.cpk,t.cepk,sac.poids,cab.poids,ppi.poids];
    colors = ['#0071e3','#34a853','#e8850e','#d4145a','#8e44ad']; title='Poids par flux (kg)';
  } else {
    labels = ['PPI','Sacs CP84','Cabine (vols)','ULD','MRD non faits'];
    data = [ppi.total,sac.total,cab.vols,t.uld,t.mrdNon];
    colors = ['#8e44ad','#e8850e','#d4145a','#003189','#c0392b']; title='Volumes clés du jour';
  }
  var ctx = document.getElementById('chart');
  if (_chart) _chart.destroy();
  _chart = new Chart(ctx, {
    type:'bar',
    data:{ labels:labels, datasets:[{ label:title, data:data.map(n), backgroundColor:colors, borderRadius:8, maxBarThickness:70 }] },
    options:{ responsive:true, plugins:{ legend:{display:false}, title:{display:true,text:title,color:'#003189',font:{size:14,weight:'700'}} },
      scales:{ y:{ beginAtZero:true, ticks:{color:'#5b6472'}, grid:{color:'#eef1f6'} }, x:{ ticks:{color:'#1a1f2e',font:{weight:'600'}}, grid:{display:false} } } }
  });
}
function setChart(m){ _chartMode = m; renderChart(); }
function onDateChange(){ render(); }

/* ── Popup macOS ── */
function openModal(title, html){ document.getElementById('dd-ttl').innerHTML = title; document.getElementById('dd-body').innerHTML = html; document.getElementById('dd-modal').classList.add('on'); }
function closeModal(){ document.getElementById('dd-modal').classList.remove('on'); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
document.addEventListener('click', function(e){ if(e.target && e.target.id==='dd-modal') closeModal(); });

/* ── Détail par KPI ── */
function showDetail(id){
  var R = window._dayRaw || {}; var d = R.d; var t = R.t || {};
  if (id.indexOf('h-') === 0){
    var b = R.brief || [];
    var body = '<div class="dd-sum">'
      +'<div class="p"><b>'+(t.cq+t.ceq+t.rq+t.pq+t.ppiq+t.pcq)+'</b><span>colis total</span></div>'
      +'<div class="p"><b>'+fmt(t.cpk+t.cepk+t.rpk+t.ppk+t.ppipk+t.pcpk)+'</b><span>kg total</span></div>'
      +'<div class="p"><b>'+t.uld+'</b><span>ULD</span></div>'
      +'<div class="p"><b>'+t.mrdNon+'</b><span>MRD non faits</span></div></div>';
    if (!b.length){ openModal('Détail Hermès — '+d, body+'<div class="empty">Aucun ULD ce jour.</div>'); return; }
    body += '<table><tr><th>CIE / Vol</th><th>Type</th><th>PRIO</th><th>ECO</th><th>Roissy</th><th>Presse</th><th>PPI</th><th>Pal.C</th><th>Statut</th><th>MRD</th></tr>';
    b.forEach(function(r){
      body += '<tr><td>'+esc(((r.cie||r.co||r.cp||'')+' '+(r.vol||r.nv||r.fl||'')).trim()||'—')+'</td><td>'+esc(r.ty||r.type||r.tp||'')+'</td>'
        +'<td>'+n(r.cq)+'</td><td>'+n(r.ceq)+'</td><td>'+n(r.rq)+'</td><td>'+n(r.pq)+'</td><td>'+n(r.ppiq)+'</td><td>'+n(r.pcq)+'</td>'
        +'<td>'+esc(r.st||'—')+'</td><td>'+esc(r.mr||'—')+'</td></tr>';
    });
    openModal('Détail Hermès — '+d, body+'</table>');
    return;
  }
  function sessions(raw, hdr, cols){
    var rows = []; Object.keys(raw||{}).forEach(function(k){ if(String(k).slice(0,10)!==d) return; rows.push({k:k,v:raw[k]}); });
    rows.sort(function(a,b){ return String(a.k).localeCompare(String(b.k)); });
    if(!rows.length) return '<div class="empty">Aucune saisie ce jour.</div>';
    return '<table><tr><th>Heure</th>'+hdr+'</tr>'+rows.map(function(x){ return '<tr><td>'+esc(String(x.k).slice(11).replace('h',':'))+'</td>'+cols(x.v)+'</tr>'; }).join('')+'</table>';
  }
  if (id==='v-ppi') openModal('Détail PPI — '+d, sessions(R.ppiH, '<th>PPI</th>', function(v){ return '<td>'+(typeof v.total==='number'?v.total:(n(v.oo)+n(v.os)+n(v.cp)+n(v.sing)))+'</td>'; }));
  else if (id==='v-sac') openModal('Détail Sacs CP84 — '+d, sessions(R.sacH, '<th>Total</th><th>PRIO</th><th>ECO</th><th>Poids plein</th>', function(v){ var p=0; if(Array.isArray(v.detail)) v.detail.forEach(function(s){ p+=n(s.poids); }); return '<td>'+(v.total!=null?v.total:(n(v.prio)+n(v.eco)))+'</td><td>'+n(v.prio)+'</td><td>'+n(v.eco)+'</td><td>'+fmt(p)+' kg</td>'; }));
  else if (id==='v-cab') openModal('Détail Cabine — '+d, sessions(R.cabH, '<th>Vols</th><th>Poids</th>', function(v){ return '<td>'+n(v.vols)+'</td><td>'+fmt(v.poids)+' kg</td>'; }));
  else if (id==='v-mrd'){ var e=(R.mrd&&R.mrd.entries)||[]; var bd = e.length? '<table><tr><th>Heure</th><th>Palette</th><th>CIE</th></tr>'+e.map(function(x){ return '<tr><td>'+esc(String(x.ts||'').slice(11,16))+'</td><td>'+esc(x.palette||'—')+'</td><td>'+esc(x.cp||x.cie||x.ag||'—')+'</td></tr>'; }).join('')+'</table>' : '<div class="empty">Aucun relevé.</div>'; openModal('Détail MRD relevés (cumul)', bd); }
}

/* ── Historique complet (comme l'onglet Historique du hub) ── */
function showHistorique(){
  var mods = [
    ['olympe_histo_ppi','PPI',function(v){ return (typeof v.total==='number'?v.total:(n(v.oo)+n(v.os)+n(v.cp)+n(v.sing)))+' PPI'; }],
    ['olympe_histo_sac','Sac CP84',function(v){ var p=0; if(Array.isArray(v.detail)) v.detail.forEach(function(s){ p+=n(s.poids); }); return (v.total!=null?v.total:(n(v.prio)+n(v.eco)))+' sacs · '+fmt(p)+' kg'; }],
    ['olympe_histo_cabine','Cabine',function(v){ return n(v.vols)+' vols · '+fmt(v.poids)+' kg'; }],
    ['olympe_histo_mrd','MRD',function(v){ return (v.total!=null?v.total+' MRD':JSON.stringify(v).slice(0,40)); }],
    ['olympe_histo_maritime','Maritime',function(v){ return (v.total!=null?v.total:JSON.stringify(v).slice(0,34)); }],
    ['olympe_histo_anomalie','Anomalie',function(v){ return (v.total!=null?v.total+' anomalie(s)':JSON.stringify(v).slice(0,34)); }],
    ['olympe_histo_vgp','VGP',function(v){ return (v.total!=null?v.total:JSON.stringify(v).slice(0,34)); }],
    ['olympe_histo_maurice','Maurice',function(v){ return (v.total!=null?v.total:JSON.stringify(v).slice(0,34)); }],
    ['olympe_histo_mayotte','Mayotte',function(v){ return (v.total!=null?v.total:JSON.stringify(v).slice(0,34)); }],
    ['olympe_histo_chronopost','Chronopost',function(v){ return (v.total!=null?v.total:JSON.stringify(v).slice(0,34)); }]
  ];
  var all = [];
  mods.forEach(function(m){ var raw = scopeObj(m[0]); if(!raw||typeof raw!=='object') return; Object.keys(raw).forEach(function(k){ var v=raw[k]; if(!v||typeof v!=='object') return; all.push({k:k,label:m[1],det:m[2](v)}); }); });
  all.sort(function(a,b){ return String(b.k).localeCompare(String(a.k)); });
  var body = all.length
    ? '<table><tr><th>Horodatage</th><th>Module</th><th>Détail</th></tr>'+all.map(function(x){ return '<tr><td>'+esc(String(x.k).slice(0,16).replace('_',' ').replace('h',':'))+'</td><td><b style="color:var(--lp-blue)">'+esc(x.label)+'</b></td><td>'+esc(x.det)+'</td></tr>'; }).join('')+'</table>'
    : '<div class="empty">Aucun historique.</div>';
  openModal('🗂 Historique complet — '+all.length+' entrées', body);
}
