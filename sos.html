<style>
:root{ --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif;
  --bg:#ececf0; --win:#fff; --ink:#1d1d1f; --ink2:#86868b; --line:#00000012; --blue:#0071e3; --me:#0b84fe; --other:#e9e9eb; --red:#ff3b30; --green:#34c759; --purple:#5856d6; --orange:#e8850e; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--font);background:linear-gradient(160deg,#d7dbe3,#c3c8d3);display:flex;align-items:center;justify-content:center;padding:12px;}
.win{width:min(440px,100%);height:100%;max-height:900px;background:var(--bg);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column;}
.bar{position:relative;display:flex;align-items:center;padding:11px 15px;background:linear-gradient(180deg,#fbfbfd,#f2f2f5);border-bottom:.5px solid var(--line);flex-shrink:0;}
.dots{display:flex;gap:7px;}.dots i{width:12px;height:12px;border-radius:50%;display:block;}
.dots i:nth-child(1){background:#ff5f57;}.dots i:nth-child(2){background:#febc2e;}.dots i:nth-child(3){background:#28c840;}
.bar .ttl{position:absolute;left:0;right:0;text-align:center;font-size:14px;font-weight:700;color:var(--ink);pointer-events:none;}

.who{display:flex;align-items:center;gap:7px;padding:8px 15px;font-size:12px;color:var(--ink2);font-weight:600;flex-shrink:0;border-bottom:.5px solid var(--line);background:#f7f8fa;}
.who b{color:var(--ink);}
.who .dot{width:8px;height:8px;border-radius:50%;background:var(--ink2);}
.who .dot.ok{background:var(--green);}.who .dot.err{background:var(--red);}
.who button{margin-left:auto;border:none;background:rgba(0,0,0,.05);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--blue);cursor:pointer;font-family:inherit;}

.top{padding:16px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0;}
/* SOS */
.sos{width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 38% 32%,#ff6b60,#ff3b30 55%,#d81f13);
  color:#fff;font-size:30px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 28px rgba(255,59,48,.5),inset 0 -5px 14px rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s;position:relative;flex-shrink:0;}
.sos small{font-size:11px;font-weight:700;letter-spacing:1px;opacity:.9;}
.sos::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:3px solid rgba(255,59,48,.5);animation:sospulse 1.6s ease-out infinite;}
@keyframes sospulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.22);opacity:0}}
.sos:active{transform:scale(.94);}
.sos.sent{background:radial-gradient(circle at 38% 32%,#4cd471,#34c759 55%,#28a048);}.sos.sent::after{display:none;}
.sos-hint{font-size:11px;color:var(--ink2);text-align:center;}

/* Quick actions */
.quick{display:flex;gap:10px;width:100%;}
.qbtn{flex:1;background:var(--win);border:none;border-radius:14px;padding:11px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 2px 7px rgba(0,0,0,.08);font-family:inherit;transition:transform .1s;}
.qbtn:active{transform:scale(.95);}
.qbtn .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;}
.qbtn.al .ic{background:var(--red);}.qbtn.ph .ic{background:var(--orange);}
.qbtn.al.on .ic{animation:recpulse .6s infinite;}
.qbtn span{font-size:12px;font-weight:700;color:var(--ink);}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.5)}50%{box-shadow:0 0 0 9px rgba(255,59,48,0)}}

/* Feed */
.feed{flex:1;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column;gap:8px;background:#f5f6fa;}
.mrow{display:flex;max-width:85%;}
.mrow.me{align-self:flex-end;flex-direction:row-reverse;}
.bub{padding:8px 12px;border-radius:15px;background:var(--other);color:var(--ink);font-size:14px;line-height:1.35;word-break:break-word;}
.me .bub{background:var(--me);color:#fff;}
.snd{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:2px;}.me .snd{display:none;}
.mt{font-size:10px;color:var(--ink2);margin-top:3px;}.me .mt{color:rgba(255,255,255,.7);text-align:right;}
.bub.sos{background:var(--red)!important;color:#fff!important;font-weight:800;min-width:230px;}
.sos-map{width:100%;height:150px;border:none;border-radius:10px;margin-top:7px;background:#dfe4ea;}
.sos-wait{font-size:11px;margin-top:4px;opacity:.85;}
.sos-geo{display:flex;align-items:center;gap:7px;margin-top:7px;}
.sos-nav,.sos-view{flex:0 0 auto;text-decoration:none;font-size:12px;font-weight:800;padding:6px 11px;border-radius:9px;}
.sos-nav{background:#fff;color:#d81f13;}
.sos-view{background:rgba(255,255,255,.22);color:#fff;}
.sos-acc{margin-left:auto;font-size:10px;opacity:.8;}
.play{width:32px;height:32px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:14px;cursor:pointer;}
.me .play{background:rgba(255,255,255,.25);}
.voice{display:flex;align-items:center;gap:9px;min-width:130px;}
.ph-img{max-width:180px;max-height:200px;border-radius:10px;display:block;cursor:pointer;}
.feed-empty{text-align:center;color:var(--ink2);font-size:12.5px;padding:30px 10px;}

/* Reply bar */
.reply{flex-shrink:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#fbfbfd;border-top:.5px solid var(--line);display:flex;align-items:center;gap:8px;}
.reply input{flex:1;padding:10px 14px;border:1px solid rgba(0,0,0,.12);border-radius:20px;font-size:15px;font-family:inherit;background:#fff;}
.reply .rb{width:42px;height:42px;border-radius:50%;border:none;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;}
.reply .mic{background:rgba(0,0,0,.06);color:#3a3a3c;touch-action:none;}
.reply .mic.rec{background:var(--red);color:#fff;animation:recpulse 1s infinite;}
.reply .sndb{background:var(--blue);}
.recbar{flex-shrink:0;display:none;align-items:center;gap:9px;padding:7px 14px;color:var(--red);font-weight:700;font-size:12.5px;background:#fff5f5;border-top:.5px solid var(--line);}
.recbar.on{display:flex;}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:recpulse 1s infinite;}

/* Toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#1d1d1f;color:#fff;padding:9px 16px;border-radius:13px;font-size:13px;font-weight:600;font-family:var(--font);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:88vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Rename modal */
.nm{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}

.nm-card{background:var(--bg);border-radius:18px;padding:26px 22px;width:min(330px,90vw);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.nm-card h3{font-size:17px;margin-bottom:5px;}.nm-card p{font-size:12.5px;color:var(--ink2);margin-bottom:16px;}
.nm-card input{width:100%;padding:11px 14px;border:1px solid rgba(0,0,0,.14);border-radius:12px;font-size:15px;text-align:center;font-family:inherit;margin-bottom:12px;}
.nm-card button{width:100%;padding:11px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;cursor:pointer;}
input[type=file]{display:none;}

/* ── Canaux ── */
.chanbar{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#f7f8fa;border-bottom:.5px solid var(--line);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:100px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:transform .12s,background .18s,color .18s;white-space:nowrap;}
.chip:active{transform:scale(.93);}
.chip.on{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(255,59,48,.35);}
.chip.add{color:var(--blue);font-weight:800;}
/* ── Commandes à distance ── */
.cmdrow{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:.5px solid var(--line);flex-shrink:0;overflow-x:auto;}
.cmdb{flex:1;min-width:84px;padding:9px;border:none;border-radius:11px;background:#f0f0f4;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .12s,background .18s;white-space:nowrap;}
.cmdb:active{transform:scale(.94);background:#e2e2e8;}
.cmdb.on{background:var(--green);color:#fff;}
/* ── Overlay alerte reçue ── */
.rmt{position:fixed;inset:0;z-index:200;background:rgba(255,59,48,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px;}
.rmt.show{display:flex;animation:rmtin .25s ease;}
@keyframes rmtin{from{opacity:0;transform:scale(1.08);}to{opacity:1;transform:none;}}
.rmt h2{font-size:30px;font-weight:800;letter-spacing:-.02em;}
.rmt p{font-size:15px;opacity:.92;}
.rmt button{padding:15px 34px;border:none;border-radius:100px;background:#fff;color:var(--red);font-size:17px;font-weight:800;cursor:pointer;}
@keyframes strobe{0%,100%{background:#fff;}50%{background:var(--red);}}
body.strobe{animation:strobe .18s linear infinite;}
/* ── Desktop : 2 colonnes ── */
@media (min-width:900px){
  body{padding:20px;}
  .win{width:min(1180px,100%);max-height:880px;display:grid;
       grid-template-columns:400px 1fr;grid-template-rows:auto auto 1fr auto;
       grid-template-areas:"bar bar" "who chan" "left feed" "left reply";}
  .bar{grid-area:bar;} .who{grid-area:who;} .chanbar{grid-area:chan;}
  .left-col{grid-area:left;display:flex;flex-direction:column;border-right:.5px solid var(--line);background:#f7f8fa;overflow-y:auto;}
  .feed{grid-area:feed;} .reply{grid-area:reply;}
  .top{padding:22px 18px;}
  .sos{width:190px !important;height:190px !important;}
  .recbar{grid-area:reply;}
}
@media (max-width:899px){ .left-col{display:contents;} }

<script>

function $(id){return document.getElementById(id);}

/* ── Connexion (arrière-plan, non bloquante) ── */
function connect(){
  try{ sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true}}); }catch(e){ toast('Erreur SDK'); return; }
  sb.auth.signInWithPassword({email:CFG.email,password:CFG.pass}).then(function(r){

    _ready=true; cdot('ok'); loadChans(); subscribe();
  }).catch(function(){ cdot('err'); });
}
function loadFeed(){
  sb.from('messages').select('*').eq('channel',_chan).order('created_at',{ascending:true}).limit(40).then(function(r){
    if(r.error) return; (r.data||[]).forEach(function(m){ if(!_byId[m.id]){_byId[m.id]=m;_msgs.push(m);} }); renderFeed();
  });
}
function subscribe(){
  try{ sb.channel('sos-feed')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(p){ onMsg(p.new); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},function(p){ onMsg(p.new,true); })
    .subscribe(); }catch(e){}
}
function onMsg(m,upd){
  if(!m||!m.id) return;
  if((m.channel||'general')!==_chan) return;             // autre canal : on ignore
  if(m.kind==='cmd'){ if(m.sender!==_sender) handleCmd(m); return; }
  if(_byId[m.id]){ for(var i=0;i<_msgs.length;i++) if(_msgs[i].id===m.id){_msgs[i]=m;break;} }
  else { _byId[m.id]=m; _msgs.push(m); _msgs.sort(function(a,b){return String(a.created_at).localeCompare(String(b.created_at));}); }

  if((m.kind==='photo'||m.kind==='voice')&&(!m.audio||String(m.audio).length<80)&&sb){ sb.from('messages').select('*').eq('id',m.id).maybeSingle().then(function(r){ if(r&&r.data&&r.data.audio){ _byId[r.data.id]=r.data; for(var i=0;i<_msgs.length;i++)if(_msgs[i].id===r.data.id){_msgs[i]=r.data;break;} renderFeed(); } }); }

}

/* ══ CANAUX ══ */
function loadChans(){
  if(!sb) return;
  sb.from('sos_channels').select('*').order('created_at').then(function(r){
    if(r.error||!r.data){ buildChans(); return; }
    _chans=r.data.length?r.data:_chans;
    var saved=localStorage.getItem(CH_KEY);
    if(saved && _chans.some(function(c){return c.name===saved;})) _chan=saved;
    buildChans(); loadFeed();
  });
}
function buildChans(){
  var b=$('chanbar'); if(!b) return;
  b.innerHTML=_chans.map(function(c){
    return '<button class="chip'+(c.name===_chan?' on':'')+'" data-ch="'+esc(c.name)+'">'+esc(c.label||c.name)+'</button>';
  }).join('')+'<button class="chip add" id="ch-add">+ Canal</button>';
}
function switchChan(n){
  if(n===_chan) return;
  _chan=n; localStorage.setItem(CH_KEY,n);
  _msgs=[]; _byId={}; renderFeed(); buildChans(); loadFeed();
  toast('Canal : '+chanLabel(n));
}
function chanLabel(n){ for(var i=0;i<_chans.length;i++) if(_chans[i].name===n) return _chans[i].label||n; return n; }
function addChan(){
  var lbl=prompt('Nom du canal (ex. « Quai import ») :'); if(!lbl) return;
  var name=lbl.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24);
  if(!name){ toast('Nom invalide'); return; }
  sb.from('sos_channels').insert({name:name,label:lbl.trim(),created_by:_sender}).then(function(r){
    if(r.error){ toast('Échec : '+r.error.message); return; }
    toast('Canal créé'); loadChans();
  });
}
function delChan(n){
  if(n==='general'){ toast('Canal Général non supprimable'); return; }
  if(!confirm('Supprimer le canal « '+chanLabel(n)+' » ?\nLes messages resteront en base.')) return;
  sb.from('sos_channels').delete().eq('name',n).then(function(r){
    if(r.error){ toast('Échec : '+r.error.message); return; }
    if(_chan===n) _chan='general';
    toast('Canal supprimé'); loadChans();
  });
}

/* ══ COMMANDES À DISTANCE (tout le monde — sécurité avant tout) ══ */
function sendCmd(action){
  if(!sb||!_ready){ toast('Hors ligne'); return; }
  sb.from('messages').insert({id:uuid(),sender:_sender,kind:'cmd',body:action,channel:_chan}).then(function(r){
    if(r.error){ toast('Échec : '+r.error.message); return; }
    toast(action==='ring'?'📢 Sonnerie envoyée':action==='strobe'?'💡 Flash envoyé':'⏹ Arrêt envoyé');
  });
}
function handleCmd(m){
  var a=m.body;
  if(a==='ring'){ showRemote('🚨 ALERTE','Demande de '+(m.sender||'équipe')); sirenBurst(); startAlarm&&startAlarm(); }
  else if(a==='strobe'){ showRemote('💡 SIGNAL','Signal visuel de '+(m.sender||'équipe')); screenStrobe(); }
  else if(a==='stop'){ remoteStop(); }
}
function showRemote(t,txt){
  var o=$('rmt'); if(!o) return;
  o.querySelector('h2').textContent=t; $('rmt-txt').textContent=txt; o.classList.add('show');
  try{ navigator.vibrate&&navigator.vibrate([300,120,300,120,600]); }catch(e){}

function screenStrobe(){
  document.body.classList.add('strobe');

function remoteStop(){
  var o=$('rmt'); if(o) o.classList.remove('show');

  try{ stopAlarm&&stopAlarm(); }catch(e){}

/* ══ DÉTECTION DE SECOUSSE (SOS mains libres) ══ */
function toggleShake(){ _shake?disableShake():enableShake(); }
function enableShake(){
  function go(){
    _shakeH=function(e){
      var a=e.accelerationIncludingGravity; if(!a) return;
      var f=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);
      if(f>34){ var now=Date.now(); if(now-_lastShake>2500){ _lastShake=now; toast('📳 Secousse → SOS'); try{fireSOS();}catch(e2){} } }
    };
    window.addEventListener('devicemotion',_shakeH);
    _shake=true; updShake(); toast('📳 Détection activée');
  }
  if(typeof DeviceMotionEvent!=='undefined' && DeviceMotionEvent.requestPermission){
    DeviceMotionEvent.requestPermission().then(function(r){ if(r==='granted') go(); else toast('Permission refusée'); }).catch(function(){toast('Non disponible');});
  } else if(typeof DeviceMotionEvent!=='undefined') go(); else toast('Capteur non disponible');
}
function disableShake(){ if(_shakeH) window.removeEventListener('devicemotion',_shakeH); _shakeH=null; _shake=false; updShake(); toast('📳 Détection désactivée'); }
function updShake(){ var b=$('shake-btn'); if(b){ b.classList.toggle('on',_shake); b.textContent=_shake?'📳 Secousse ON':'📳 Secousse'; } }

/* ── Rendu du fil ── */
function fmtT(iso){try{return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

  var f=$('feed'); if(!f) return;
  if(!_msgs.length){ f.innerHTML='<div class="feed-empty">Aucun message. Écris, parle 🎙, ou déclenche le SOS.</div>'; return; }

  f.innerHTML=_msgs.slice(-40).map(function(m){
    var me=(m.sender===_sender); var inner;
    if(m.deleted) inner='<div class="bub" style="opacity:.6;font-style:italic">🚫 supprimé</div>';
    else if(m.kind==='sos'){ var g=parseGeo(m.body); inner='<div class="bub sos">🚨 ALERTE SOS'+(g?mapHtml(g):'<div class="sos-wait">📍 localisation…</div>')+'<div class="mt">'+esc(m.sender||'')+' · '+fmtT(m.created_at)+'</div></div>'; }
    else if(m.kind==='voice') inner='<div class="bub">'+(me?'':'<div class="snd">'+esc(m.sender)+'</div>')+'<div class="voice"><button class="play" onclick="playV(this,\''+esc(m.id)+'\')">▶</button><span style="font-size:12px">🎙 vocal</span></div><div class="mt">'+fmtT(m.created_at)+'</div></div>';
    else if(m.kind==='photo') inner='<div class="bub">'+(me?'':'<div class="snd">'+esc(m.sender)+'</div>')+'<img class="ph-img" src="'+esc(m.audio||'')+'" onclick="try{window.open(this.src)}catch(e){}"><div class="mt">'+fmtT(m.created_at)+'</div></div>';
    else inner='<div class="bub">'+(me?'':'<div class="snd">'+esc(m.sender)+'</div>')+esc(m.body||'').replace(/\n/g,'<br>')+'<div class="mt">'+fmtT(m.created_at)+'</div></div>';
    return '<div class="mrow'+(me?' me':'')+'">'+inner+'</div>';
  }).join('');
  if(near) f.scrollTop=f.scrollHeight;
}
function playV(btn,id){ var m=_byId[id]; if(!m||!m.audio) return; try{ var a=new Audio(m.audio); btn.textContent='⏸'; a.play(); a.onended=function(){btn.textContent='▶';}; }catch(e){} }

/* ── Envoi ── */
function send(row,ok){
  row.id=row.id||uuid(); row.sender=_sender; row.deleted=false; row.created_at=new Date().toISOString(); row.channel=_chan;
  _byId[row.id]=row; _msgs.push(row); renderFeed();
  if(!sb||!_ready){ toast('Connexion…'); return; }
  sb.from('messages').insert(row).then(function(r){ if(r.error) toast('Échec envoi'); else if(ok) toast(ok); });
}
function sendText(){ var v=$('txt-in').value.trim(); if(!v) return; send({kind:'text',body:v}); $('txt-in').value=''; }
function sendPhoto(input){
  var f=input.files&&input.files[0]; if(!f) return; toast('Photo…');
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){ var mx=1000,w=img.width,h=img.height; if(w>mx||h>mx){ if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;} }
    var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    send({kind:'photo',audio:c.toDataURL('image/jpeg',0.75),body:''},'Photo envoyée ✓'); };
  img.onerror=function(){toast('Photo illisible');}; img.src=url; input.value='';
}

/* ── SOS (appui long) ── */
var _st=null,_sh=false;
function sosStart(){ _sh=true; var start=Date.now(); $('sos-lbl').textContent='...';
  _st=setInterval(function(){ var p=(Date.now()-start)/1500; $('sos-lbl').textContent=p>=1?'ENVOI':Math.ceil((1500-(Date.now()-start))/1000)+'s'; if(p>=1){clearInterval(_st); if(_sh) fireSOS();} },100); }
function sosCancel(){ _sh=false; clearInterval(_st); if(!$('sos-btn').classList.contains('sent')) $('sos-lbl').textContent='MAINTENIR'; }
function fireSOS(){ _sh=false;
  var sosId=uuid();
  send({id:sosId,kind:'sos',body:''},'🚨 Alerte envoyée !'); sirenBurst();
  var b=$('sos-btn'); b.classList.add('sent'); $('sos-lbl').textContent='ENVOYÉ ✓';
  setTimeout(function(){ b.classList.remove('sent'); $('sos-lbl').textContent='MAINTENIR'; },4000);
  locateAndAttach(sosId);
}
/* ── géolocalisation : joint la position à l'alerte ── */
var _track=null;
function locateAndAttach(sosId){
  if(!navigator.geolocation){ toast('📍 GPS indisponible'); return; }
  toast('📍 Localisation…');
  function push(pos){
    var geo=JSON.stringify({lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy||0),t:Date.now()});
    var m=_byId[sosId]; if(m){ m.body=geo; renderFeed(); }
    if(sb&&_ready) sb.from('messages').update({body:geo}).eq('id',sosId).then(function(){});
  }
  navigator.geolocation.getCurrentPosition(function(p){ push(p); toast('📍 Position partagée en direct'); }, function(){ toast('📍 Position indisponible'); }, {enableHighAccuracy:true,timeout:12000,maximumAge:0});
  try{ stopTrack(); var last=0;
    _track=navigator.geolocation.watchPosition(function(p){ var now=Date.now(); if(now-last<8000) return; last=now; push(p); }, function(){}, {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    setTimeout(stopTrack, 300000);
  }catch(e){}
}
function stopTrack(){ if(_track!=null){ try{navigator.geolocation.clearWatch(_track);}catch(e){} _track=null; } }
function parseGeo(body){ try{ var o=JSON.parse(body); if(o&&typeof o.lat==='number'&&typeof o.lng==='number') return o; }catch(e){} return null; }
function mapHtml(g){
  var dW=0.006,dH=0.004;
  var bbox=(g.lng-dW)+','+(g.lat-dH)+','+(g.lng+dW)+','+(g.lat+dH);
  var osm='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+g.lat+','+g.lng;
  var nav='https://www.google.com/maps/dir/?api=1&destination='+g.lat+','+g.lng+'&travelmode=driving';
  var view='https://www.google.com/maps/search/?api=1&query='+g.lat+','+g.lng;
  return '<iframe class="sos-map" src="'+osm+'" loading="lazy" referrerpolicy="no-referrer"></iframe>'
    +'<div class="sos-geo"><a class="sos-nav" href="'+nav+'" target="_blank" rel="noopener">🧭 Itinéraire</a>'
    +'<a class="sos-view" href="'+view+'" target="_blank" rel="noopener">📍 Voir</a>'
    +(g.acc?'<span class="sos-acc">±'+g.acc+' m</span>':'')+'</div>';
}

/* ── Sons ── */
function ctx(){ try{ var C=window.AudioContext||window.webkitAudioContext; _ac=_ac||new C(); if(_ac.state==='suspended')_ac.resume(); return _ac; }catch(e){ return null; } }
function beep(){ var a=ctx(); if(!a) return; [0,.17].forEach(function(t,i){ var o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=i?900:680; o.connect(g); g.connect(a.destination); var s=a.currentTime+t; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.28,s+.01); g.gain.exponentialRampToValueAtTime(.0001,s+.14); o.start(s); o.stop(s+.15); }); }
function sirenBurst(){ var a=ctx(); if(a){ for(var i=0;i<8;i++){ var o=a.createOscillator(),g=a.createGain(); o.type='square'; o.frequency.value=i%2?1180:820; o.connect(g); g.connect(a.destination); var s=a.currentTime+i*.33; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.4,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.31); o.start(s); o.stop(s+.32); } } try{if(navigator.vibrate)navigator.vibrate([500,150,500,150,500,150,700]);}catch(e){} }

/* ── Alarme locale (sirène continue, à fond) ── */
var _alarm=null,_alVib=null,_alOn=false;
function toggleAlarm(){ _alOn?stopAlarm():startAlarm(); }
function startAlarm(){
  var a=ctx(); if(a){ try{
    var osc=a.createOscillator(), gain=a.createGain(), lfo=a.createOscillator(), lfoG=a.createGain();
    osc.type='sawtooth'; osc.frequency.value=800; lfo.type='sine'; lfo.frequency.value=3.5; lfoG.gain.value=420;
    lfo.connect(lfoG); lfoG.connect(osc.frequency); osc.connect(gain); gain.gain.value=0.6; gain.connect(a.destination);
    osc.start(); lfo.start(); _alarm={osc:osc,lfo:lfo,gain:gain};
  }catch(e){} }
  _alVib=setInterval(function(){ try{if(navigator.vibrate)navigator.vibrate([600,250]);}catch(e){} },850);
  _alOn=true; $('al-btn').classList.add('on'); $('al-lbl').textContent='STOP'; toast('🔔 Alarme activée');
}
function stopAlarm(){ try{ if(_alarm){ _alarm.osc.stop(); _alarm.lfo.stop(); _alarm=null; } }catch(e){} clearInterval(_alVib); try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){} _alOn=false; $('al-btn').classList.remove('on'); $('al-lbl').textContent='Alarme'; }

/* ── Vocal (push-to-talk) ── */
function pickMime(){ var o=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']; if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return ''; for(var i=0;i<o.length;i++)if(MediaRecorder.isTypeSupported(o[i]))return o[i]; return ''; }
function vocStart(){ if(_rec.active) return; if(!navigator.mediaDevices||!window.MediaRecorder){toast('Vocal non supporté');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr=new MediaRecorder(stream,pickMime()?{mimeType:pickMime()}:undefined),chunks=[];
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=function(){ stream.getTracks().forEach(function(t){t.stop();}); var blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); var dur=(Date.now()-_rec.start)/1000; recUI(false); if(dur>=.4&&blob.size>0){ var fr=new FileReader(); fr.onload=function(){ send({kind:'voice',audio:fr.result,duration:Math.round(dur*10)/10},'Vocal envoyé ✓'); }; fr.readAsDataURL(blob); } };
    _rec={active:true,mr:mr,start:Date.now(),stream:stream}; mr.start(); recUI(true);
    _rec.timer=setInterval(function(){ var s=Math.floor((Date.now()-_rec.start)/1000); $('rec-t').textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); },200);
    _rec.max=setTimeout(vocStop,30000);
  }).catch(function(){ toast('Micro refusé'); recUI(false); });
}
function vocStop(){ if(!_rec.active)return; clearInterval(_rec.timer); clearTimeout(_rec.max); _rec.active=false; try{_rec.mr.stop();}catch(e){recUI(false);} }
function recUI(on){ $('mic-btn').classList.toggle('rec',on); $('recbar').classList.toggle('on',on); if(on)$('rec-t').textContent='0:00'; }

/* ── Pseudo (facultatif) ── */
function loadName(){ try{ var v=localStorage.getItem(NAME_KEY); if(v)_sender=v; }catch(e){} $('who-name').textContent=_sender; }
function askName(){ $('nm').classList.add('on'); var i=$('nm-in'); i.value=(_sender==='SOS'?'':_sender); setTimeout(function(){i.focus();},60); }
function saveName(){ var v=$('nm-in').value.trim().slice(0,24)||'SOS'; _sender=v; try{localStorage.setItem(NAME_KEY,v);}catch(e){} $('who-name').textContent=v; $('nm').classList.remove('on'); renderFeed(); }

/* ── Autorisations (notif + micro + caméra) au 1er tap, une seule fois après install ── */
function requestAllPerms(){
  try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
  try{ if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){ navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(function(s){ s.getTracks().forEach(function(t){t.stop();}); }).catch(function(){ try{ navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ s.getTracks().forEach(function(t){t.stop();}); }).catch(function(){}); }catch(e){} }); }
  }catch(e){}
  try{ if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(){},function(){},{timeout:8000}); }catch(e){}
  ctx();
}
function maybeAskPerms(){ try{ if(localStorage.getItem('olympe_sos_perms')) return; }catch(e){} var h=function(){ try{localStorage.setItem('olympe_sos_perms','1');}catch(e){} requestAllPerms(); }; document.addEventListener('pointerdown', h, {once:true}); }

/* ── Câblage ── */
window.addEventListener('DOMContentLoaded',function(){
  loadName(); connect(); maybeAskPerms();
  var s=$('sos-btn');
  s.addEventListener('mousedown',function(e){e.preventDefault();ctx();sosStart();});
  s.addEventListener('mouseup',sosCancel); s.addEventListener('mouseleave',sosCancel);
  s.addEventListener('touchstart',function(e){e.preventDefault();ctx();sosStart();},{passive:false});
  s.addEventListener('touchend',function(e){e.preventDefault();sosCancel();},{passive:false});
  var m=$('mic-btn');
  m.addEventListener('mousedown',function(e){e.preventDefault();vocStart();});
  m.addEventListener('mouseup',vocStop); m.addEventListener('mouseleave',function(){if(_rec.active)vocStop();});
  m.addEventListener('touchstart',function(e){e.preventDefault();vocStart();},{passive:false});
  m.addEventListener('touchend',function(e){e.preventDefault();vocStop();},{passive:false});
  $('nm-in').addEventListener('keydown',function(e){if(e.key==='Enter')saveName();});
});
</script>
