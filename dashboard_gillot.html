<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Gillot 📊</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EDEEF2; --panel:#FBFCFE; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#5B6472; --ink3:#8A93A3;
  --line:rgba(60,66,80,.12); --blue:#003189; --blue2:#0A66C2; --yellow:#FFCC00; --yellow-d:#E0A800;
  --green:#248A3D; --red:#D70015; --shadow:0 8px 26px rgba(20,30,60,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{ background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; }
/* ── Fenêtre macOS ── */
.dg-win{ min-height:100%; display:flex; flex-direction:column; }
.dg-titlebar{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:11px 16px;
  background:rgba(251,252,254,.8); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--line); }
.dg-traffic{ display:flex; gap:8px; }
.dg-traffic i{ width:12px; height:12px; border-radius:50%; display:block; }
.dg-traffic .r{ background:#FF5F57; } .dg-traffic .y{ background:#FEBC2E; } .dg-traffic .g{ background:#28C840; }
.dg-title{ flex:1; text-align:center; font-weight:700; font-size:14px; color:var(--ink2); letter-spacing:.2px; }
.dg-title b{ color:var(--blue); }
.dg-tb-btn{ border:none; background:rgba(120,128,145,.14); color:var(--blue2); cursor:pointer; border-radius:8px;
  padding:7px 12px; font-family:inherit; font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:5px; }
.dg-tb-btn:hover{ background:rgba(120,128,145,.24); }
.dg-tb-btn.accent{ background:var(--blue); color:#fff; }
.dg-tb-btn.accent:hover{ background:#00256b; }
/* ── Barre de jour ── */
.dg-daybar{ display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 16px 6px; flex-wrap:wrap; }
.dg-day-nav{ width:38px; height:38px; border-radius:11px; border:.5px solid var(--line); background:var(--card);
  color:var(--blue); font-size:18px; cursor:pointer; box-shadow:var(--shadow); }
.dg-day-nav:hover{ background:#f3f5f9; }
.dg-date{ border:.5px solid var(--line); background:var(--card); border-radius:12px; padding:9px 14px; font-family:inherit;
  font-size:15px; font-weight:700; color:var(--ink); box-shadow:var(--shadow); color-scheme:light; }
.dg-today{ border:none; background:var(--yellow); color:var(--blue); font-weight:800; border-radius:11px; padding:9px 15px;
  cursor:pointer; font-family:inherit; font-size:13px; box-shadow:0 4px 12px rgba(255,204,0,.4); }
.dg-day-lbl{ width:100%; text-align:center; font-size:12.5px; color:var(--ink2); margin-top:2px; font-weight:600; text-transform:capitalize; }
/* ── Grille KPI ── */
.dg-body{ flex:1; padding:12px 16px 60px; max-width:1180px; margin:0 auto; width:100%; }
.dg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; }
.dg-kpi{ background:var(--card); border:.5px solid var(--line); border-radius:18px; padding:16px 16px 12px;
  box-shadow:var(--shadow); position:relative; display:flex; flex-direction:column; }
.dg-kpi-h{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.dg-kpi-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px;
  background:linear-gradient(135deg, rgba(0,49,137,.1), rgba(0,49,137,.04)); flex:0 0 auto; }
.dg-kpi-t{ flex:1; font-size:12.5px; font-weight:800; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; }
.dg-chk{ width:20px; height:20px; accent-color:var(--blue); cursor:pointer; }
.dg-kpi-main{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.dg-kpi-num{ font-size:34px; font-weight:800; color:var(--blue); line-height:1; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
.dg-kpi-unit{ font-size:13px; font-weight:700; color:var(--ink2); }
.dg-kpi-sub{ font-size:12.5px; color:var(--ink2); margin-top:8px; line-height:1.5; }
.dg-kpi-sub .tag{ display:inline-block; background:#F0F3F8; border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0; font-weight:700; color:var(--blue2); }
.dg-kpi-sub .tag.eco{ color:#0A7C8A; background:#E4F6F8; } .dg-kpi-sub .tag.prio{ color:#B24020; background:#FDEEE7; }
.dg-kpi-foot{ margin-top:auto; padding-top:12px; display:flex; gap:8px; }
.dg-detail{ flex:1; border:none; background:rgba(0,49,137,.08); color:var(--blue); font-weight:700; border-radius:9px;
  padding:8px; cursor:pointer; font-family:inherit; font-size:12.5px; }
.dg-detail:hover{ background:rgba(0,49,137,.16); }
.dg-kpi.span2{ grid-column:span 2; }
@media(max-width:640px){ .dg-kpi.span2{ grid-column:span 1; } }
/* ── Tableau PPI ── */
.dg-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
.dg-table th{ background:#EEF1F6; color:var(--ink2); font-weight:700; text-transform:uppercase; font-size:10px; letter-spacing:.3px;
  padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); }
.dg-table td{ padding:8px 10px; border-bottom:1px solid rgba(60,66,80,.07); color:var(--ink); }
.dg-table tr:hover td{ background:rgba(10,102,194,.05); }
.dg-mini-detail{ border:none; background:var(--yellow); color:var(--blue); font-weight:800; border-radius:7px; padding:4px 9px; cursor:pointer; font-size:11px; }
.dg-empty{ color:var(--ink3); font-size:13px; text-align:center; padding:22px; }
/* ── Graphique ── */
.dg-chart-card{ background:var(--card); border:.5px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-top:16px; }
.dg-chart-card h3{ font-size:13px; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
/* ── Popup ── */
.dg-modal{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; padding:16px;
  background:rgba(20,26,44,.4); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
.dg-modal.show{ display:flex; animation:dgF .16s ease; }
@keyframes dgF{ from{opacity:0} to{opacity:1} }
.dg-card{ width:min(560px,96vw); max-height:88vh; overflow-y:auto; background:var(--panel); border-radius:16px;
  border:.5px solid var(--line); box-shadow:0 24px 70px rgba(0,0,0,.4); animation:dgP .2s cubic-bezier(.2,.9,.3,1.2); }
@keyframes dgP{ from{transform:scale(.94);opacity:.5} to{transform:scale(1);opacity:1} }
.dg-card-h{ position:sticky; top:0; background:rgba(251,252,254,.92); backdrop-filter:blur(10px); display:flex; align-items:center;
  gap:10px; padding:14px 16px; border-bottom:.5px solid var(--line); z-index:1; }
.dg-card-h .t{ flex:1; font-weight:800; font-size:15px; color:var(--blue); }
.dg-card-x{ width:30px; height:30px; border:none; border-radius:50%; background:rgba(120,128,145,.16); color:#333; cursor:pointer; font-size:15px; }
.dg-card-b{ padding:14px 16px; }
.dg-sub-h{ font-size:11px; font-weight:800; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 6px; }
.dg-line{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid rgba(60,66,80,.07); font-size:13px; }
.dg-line .k{ color:var(--ink2); } .dg-line .v{ font-weight:700; color:var(--ink); }
.dg-code{ font-family:'SF Mono',monospace; font-size:11px; color:var(--ink2); background:#F0F3F8; border-radius:5px; padding:2px 6px; display:inline-block; margin:2px; }
.dg-toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); z-index:90; background:#1c1c1e; color:#fff;
  padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; }
.dg-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
/* ── Barre de partage ── */
.dg-sharebar{ position:sticky; bottom:0; z-index:25; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; background:rgba(251,252,254,.9); backdrop-filter:blur(20px); border-top:.5px solid var(--line); }
.dg-sharebar .info{ flex:1; font-size:12.5px; color:var(--ink2); }
@media print{ .dg-titlebar,.dg-daybar,.dg-sharebar,.dg-detail,.dg-chk,.dg-mini-detail{ display:none !important; }
  body{ background:#fff; } .dg-kpi,.dg-chart-card{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; } }
</style>
</head>
<body>
<div class="dg-win">
  <div class="dg-titlebar">
    <div class="dg-traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="dg-title">📊 <b>Dashboard</b> — Récap journée · PIC Gillot Import</div>
    <button class="dg-tb-btn" id="dg-print">🖨 Imprimer</button>
    <button class="dg-tb-btn" id="dg-home">🏠 Accueil</button>
  </div>

  <div class="dg-daybar">
    <button class="dg-day-nav" id="dg-prev" title="Jour précédent">‹</button>
    <input type="date" class="dg-date" id="dg-date">
    <button class="dg-day-nav" id="dg-next" title="Jour suivant">›</button>
    <button class="dg-today" id="dg-todaybtn">Aujourd'hui</button>
    <div class="dg-day-lbl" id="dg-daylbl"></div>
  </div>

  <div class="dg-body">
    <div class="dg-grid" id="dg-grid"></div>
    <div class="dg-chart-card">
      <h3>📈 Tendance — 7 derniers jours</h3>
      <canvas id="dg-chart" height="120"></canvas>
    </div>
  </div>

  <div class="dg-sharebar">
    <span class="info">☑︎ Coche les KPI à partager, puis choisis un format.</span>
    <button class="dg-tb-btn" id="dg-share-mail">✉️ Envoyer par mail</button>
    <button class="dg-tb-btn accent" id="dg-share-pdf">📄 Exporter en PDF</button>
  </div>
</div>

<div class="dg-modal" id="dg-modal"><div class="dg-card">
  <div class="dg-card-h"><span class="t" id="dg-m-title">Détail</span><button class="dg-card-x" id="dg-m-x">✕</button></div>
  <div class="dg-card-b" id="dg-m-body"></div>
</div></div>
<div class="dg-toast" id="dg-toast"></div>

<script>
(function(){
  'use strict';
  var $=function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function r1(n){ return Math.round((Number(n)||0)*10)/10; }
  function toast(m){ var t=$('dg-toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }

  /* ── accès données du hub parent ── */
  function DB(){ try{ if(window.parent && window.parent!==window && window.parent.OlympeDB) return window.parent.OlympeDB; }catch(e){} try{ if(window.OlympeDB) return window.OlympeDB; }catch(e){} return { getItem:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} } }; }
  function J(key){ try{ return JSON.parse(DB().getItem(key)||'{}')||{}; }catch(e){ return {}; } }
  function dayKeys(raw, date){ return Object.keys(raw||{}).filter(function(k){ return String(k).slice(0,10)===date; }); }

  var _date = new Date().toISOString().slice(0,10);
  var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  function frLabel(iso){ var d=new Date(iso+'T12:00:00'); return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear(); }

  /* ══ AGRÉGATIONS PAR SOURCE ══ */
  // Cabine (structure confirmée : {vols, poids, detail:[{depeche,poids,code}]})
  function cabine(date){ var raw=J('olympe_histo_cabine'), v=0,p=0,det=[];
    dayKeys(raw,date).forEach(function(k){ var e=raw[k]; v+=(e.vols||0); p+=(e.poids||0); (e.detail||[]).forEach(function(x){det.push(x);}); });
    return { vols:v, poids:r1(p), detail:det }; }
  // Sac CP84 (confirmé : detail[{type:'PRIO'|'ECO', depeche, poids, orig, dest, code}])
  function sac(date){ var raw=J('olympe_histo_sac'), prio=0,eco=0,pP=0,pE=0,det=[];
    dayKeys(raw,date).forEach(function(k){ var e=raw[k];
      (e.detail||[]).forEach(function(x){ det.push(x); var pd=+(x.poids||0)||0; if(String(x.type).toUpperCase()==='ECO'){eco++;pE+=pd;}else{prio++;pP+=pd;} });
      if(!(e.detail&&e.detail.length)){ prio+=(e.prio||0); eco+=(e.eco||0); }
    });
    return { prio:prio, eco:eco, poidsPrio:r1(pP), poidsEco:r1(pE), total:prio+eco, poids:r1(pP+pE), detail:det }; }
  // PPI (par contenant : {oo,os,sing,cp + poids... + detail RESCON}) — défensif
  function ppi(date){ var raw=J('olympe_histo_ppi'), rows=[], tot={oo:0,os:0,sing:0,cp:0,pOO:0,pOS:0,pSing:0,pCP:0};
    dayKeys(raw,date).forEach(function(k){ var e=raw[k]||{};
      var row={ key:k, contenant:e.contenant||e.num||e.numContenant||e.uld||'—',
        compagnie:e.compagnie||e.cie||e.airline||'—', vol:e.vol||e.numVol||e.flight||'—',
        pNet:+(e.poidsNet||e.pnet||e.pNet||0)||0, pBrut:+(e.poidsBrut||e.pbrut||e.pBrut||0)||0,
        oo:+(e.oo||0)||0, os:+(e.os||0)||0, sing:+(e.sing||e.singapour||0)||0, cp:+(e.cp||e.cp84||0)||0,
        pOO:+(e.pOO||e.poidsOO||0)||0, pOS:+(e.pOS||e.poidsOS||0)||0, pSing:+(e.pSing||e.poidsSing||0)||0, pCP:+(e.pCP||e.poidsCP||0)||0,
        detail:e.detail||e.codes||[] };
      rows.push(row);
      tot.oo+=row.oo; tot.os+=row.os; tot.sing+=row.sing; tot.cp+=row.cp;
      tot.pOO+=row.pOO; tot.pOS+=row.pOS; tot.pSing+=row.pSing; tot.pCP+=row.pCP;
    });
    return { rows:rows, tot:tot }; }
  // Hermès relevé / ULD (olympe_mrd_releve_v1) — total ULD + flashés
  function uld(date){ var raw=J('olympe_mrd_releve_v1'); var list=[];
    // format supposé : {entries:[{id,date,uld,agent,compagnie,done/flashe}]} OU map par id
    var arr = Array.isArray(raw.entries)?raw.entries : Object.keys(raw).map(function(k){ return raw[k]; }).filter(function(x){ return x&&typeof x==='object'; });
    arr.forEach(function(e){ if(!e) return; var ed=(e.date||e.jour||'').slice(0,10); if(ed && ed!==date) return; list.push(e); });
    var total=list.length, flashe=list.filter(function(e){ return e.done||e.flashe||e.fait||e.flashed; }).length;
    return { total:total, flashe:flashe, nonFait:total-flashe, list:list }; }
  // VPG + Anomalie
  function vpgAno(date){ var vg=J('olympe_histo_vgp'), an=J('olympe_histo_anomalie');
    function cnt(raw){ var n=0,det=[]; dayKeys(raw,date).forEach(function(k){ var e=raw[k]; var c=(e&&(e.total||e.count))|| (e&&e.detail?e.detail.length:1); n+=c||0; if(e&&e.detail)det=det.concat(e.detail); }); return {n:n,det:det}; }
    var v=cnt(vg), a=cnt(an); return { vpg:v.n, ano:a.n, vpgDet:v.det, anoDet:a.det }; }

  /* ══ RENDU DES KPI ══ */
  function kpiCard(id,ic,title,mainHtml,subHtml,hasDetail){
    return '<div class="dg-kpi" data-kpi="'+id+'">'
      +'<div class="dg-kpi-h"><span class="dg-kpi-ic">'+ic+'</span><span class="dg-kpi-t">'+esc(title)+'</span>'
        +'<input type="checkbox" class="dg-chk" data-share="'+id+'" title="Partager ce KPI"></div>'
      +'<div class="dg-kpi-main">'+mainHtml+'</div>'
      +(subHtml?'<div class="dg-kpi-sub">'+subHtml+'</div>':'')
      +(hasDetail?'<div class="dg-kpi-foot"><button class="dg-detail" data-detail="'+id+'">🔍 Détail</button></div>':'')
      +'</div>';
  }
  function num(n,unit){ return '<span class="dg-kpi-num">'+n+'</span>'+(unit?'<span class="dg-kpi-unit">'+unit+'</span>':''); }

  function render(){
    $('dg-date').value=_date; $('dg-daylbl').textContent=frLabel(_date);
    var c=cabine(_date), sc=sac(_date), pp=ppi(_date), ul=uld(_date), va=vpgAno(_date);
    var g=$('dg-grid'); var h='';

    // 1) ULD + flashés (Hermès)
    h+=kpiCard('uld','🛬','ULD — Relevé Rescon / MRD',
      num(ul.total,'ULD'),
      '<span class="tag">'+ul.flashe+' flashés</span><span class="tag prio">'+ul.nonFait+' non faits</span>', true);

    // 2) PPI (tableau)
    var ppRows = pp.rows.length ? pp.rows.map(function(r){
      return '<tr><td><b>'+esc(r.contenant)+'</b></td>'
        +'<td>'+r.oo+(r.pOO?' · '+r1(r.pOO)+'kg':'')+'</td>'
        +'<td>'+r.os+(r.pOS?' · '+r1(r.pOS)+'kg':'')+'</td>'
        +'<td>'+r.sing+(r.pSing?' · '+r1(r.pSing)+'kg':'')+'</td>'
        +'<td>'+r.cp+(r.pCP?' · '+r1(r.pCP)+'kg':'')+'</td>'
        +'<td><button class="dg-mini-detail" data-ppi="'+esc(r.key)+'">détail</button></td></tr>';
    }).join('') : '';
    var ppTable = pp.rows.length
      ? '<table class="dg-table"><thead><tr><th>N° Contenant</th><th>OO</th><th>OS</th><th>Singapour</th><th>CP84</th><th></th></tr></thead><tbody>'+ppRows+'</tbody></table>'
      : '<div class="dg-empty">Aucun PPI flashé ce jour.</div>';
    h+='<div class="dg-kpi span2" data-kpi="ppi"><div class="dg-kpi-h"><span class="dg-kpi-ic">📦</span><span class="dg-kpi-t">PPI flashés — Saisie du jour</span><input type="checkbox" class="dg-chk" data-share="ppi"></div>'+ppTable+'</div>';

    // 3) Sac CP84
    h+=kpiCard('sac','🛄','Sacs CP84 — flashés',
      num(sc.total,'sacs'),
      '<span class="tag prio">PRIO '+sc.prio+' · '+sc.poidsPrio+'kg</span><span class="tag eco">ECO '+sc.eco+' · '+sc.poidsEco+'kg</span>', true);

    // 4) Cabine
    h+=kpiCard('cabine','✈️','Cabine — flashée',
      num(c.vols,'dép.')+' <span class="dg-kpi-unit">·</span> '+num(c.poids,'kg'),
      '', c.detail.length>0);

    // 5) MRD non faits
    h+=kpiCard('mrd','📋','MRD non faits du jour',
      num(ul.nonFait,'MRD'),
      '<span class="tag">sur '+ul.total+' au total</span>', true);

    // 6) VPG + Anomalie
    h+=kpiCard('vpgano','⚠️','Registre VPG + Anomalies colis',
      num(va.vpg,'VPG')+' <span class="dg-kpi-unit">·</span> '+num(va.ano,'anomalies'),
      '', (va.vpgDet.length+va.anoDet.length)>0);

    g.innerHTML=h;
    drawChart();
  }

  /* ══ POPUPS DÉTAIL ══ */
  function openModal(title, bodyHtml){ $('dg-m-title').innerHTML=title; $('dg-m-body').innerHTML=bodyHtml; $('dg-modal').classList.add('show'); }
  function closeModal(){ $('dg-modal').classList.remove('show'); }
  function line(k,v){ return '<div class="dg-line"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'; }

  function detail(id){
    if(id==='cabine'){ var c=cabine(_date);
      var body=c.detail.length? c.detail.map(function(x){ return line((x.depeche||'—')+(x.code?' · '+x.code:''), r1(x.poids)+' kg'); }).join('') : '<div class="dg-empty">Aucun détail.</div>';
      openModal('✈️ Cabine — '+frLabel(_date), '<div class="dg-sub-h">'+c.vols+' dépêches · '+c.poids+' kg</div>'+body);
    }
    else if(id==='sac'){ var s=sac(_date);
      function grp(type){ var items=s.detail.filter(function(x){return String(x.type).toUpperCase()===type;}).sort(function(a,b){ return String(a.depeche).localeCompare(String(b.depeche)); });
        return items.length? items.map(function(x){ return line((x.depeche||'—')+(x.code?' · '+x.code:''), r1(x.poids)+' kg'); }).join('') : '<div class="dg-empty">—</div>'; }
      openModal('🛄 Sacs CP84 — '+frLabel(_date),
        '<div class="dg-sub-h">PRIO — '+s.prio+' sacs · '+s.poidsPrio+' kg</div>'+grp('PRIO')
        +'<div class="dg-sub-h">ECO — '+s.eco+' sacs · '+s.poidsEco+' kg</div>'+grp('ECO'));
    }
    else if(id==='mrd' || id==='uld'){ var u=uld(_date);
      function by(field){ var m={}; u.list.forEach(function(e){ if(id==='mrd' && (e.done||e.flashe||e.fait)) return; var key=e[field]||'—'; m[key]=(m[key]||0)+1; });
        var ks=Object.keys(m); return ks.length? ks.map(function(k){ return line(k, m[k]+' ULD'); }).join('') : '<div class="dg-empty">—</div>'; }
      var names=u.list.filter(function(e){ return id!=='mrd' || !(e.done||e.flashe||e.fait); }).map(function(e){ return '<span class="dg-code">'+esc(e.uld||e.num||e.id||'?')+'</span>'; }).join(' ');
      openModal((id==='mrd'?'📋 MRD non faits':'🛬 ULD')+' — '+frLabel(_date),
        '<div class="dg-sub-h">Par agent</div>'+by('agent')
        +'<div class="dg-sub-h">Par compagnie</div>'+by('compagnie')
        +'<div class="dg-sub-h">ULD concernés</div><div>'+(names||'<span class="dg-empty">—</span>')+'</div>');
    }
    else if(id==='vpgano'){ var va=vpgAno(_date);
      function lst(arr){ return arr&&arr.length? arr.map(function(x){ return line(x.ref||x.colis||x.num||'—', x.motif||x.type||x.obs||''); }).join('') : '<div class="dg-empty">—</div>'; }
      openModal('⚠️ VPG + Anomalies — '+frLabel(_date),
        '<div class="dg-sub-h">Registre VPG ('+va.vpg+')</div>'+lst(va.vpgDet)
        +'<div class="dg-sub-h">Anomalies colis ('+va.ano+')</div>'+lst(va.anoDet));
    }
  }
  function ppiDetail(key){ var raw=J('olympe_histo_ppi'), e=raw[key]||{};
    var det=e.detail||e.codes||[];
    function codesByType(t){ var arr=(det||[]).filter(function(x){ return String(x.type||x.cat||'').toUpperCase().indexOf(t)>=0; });
      return arr.length? arr.map(function(x){ return '<span class="dg-code">'+esc(x.code||x.barcode||x)+'</span>'; }).join(' ') : '<span class="dg-empty">—</span>'; }
    var rescon = '<div class="dg-sub-h">Codes RESCON par type</div>'
      +'<div class="dg-sub-h" style="color:var(--blue2)">OO</div><div>'+codesByType('OO')+'</div>'
      +'<div class="dg-sub-h" style="color:var(--blue2)">OS</div><div>'+codesByType('OS')+'</div>'
      +'<div class="dg-sub-h" style="color:var(--blue2)">SINGAPOUR</div><div>'+codesByType('SING')+'</div>'
      +'<div class="dg-sub-h" style="color:var(--blue2)">CP84</div><div>'+codesByType('CP')+'</div>';
    openModal('📦 Contenant '+esc(e.contenant||e.num||'—'),
      line('Compagnie', e.compagnie||e.cie||'—')+line('N° Vol', e.vol||e.numVol||'—')
      +line('N° Contenant', e.contenant||e.num||'—')+line('Poids Net', r1(e.poidsNet||e.pnet||0)+' kg')+line('Poids Brut', r1(e.poidsBrut||e.pbrut||0)+' kg')
      +line('Total OO', (e.oo||0)+' · '+r1(e.pOO||e.poidsOO||0)+' kg')
      +line('Total OS', (e.os||0)+' · '+r1(e.pOS||e.poidsOS||0)+' kg')
      +line('Singapour', (e.sing||e.singapour||0)+' · '+r1(e.pSing||0)+' kg')
      +line('Total CP84', (e.cp||e.cp84||0)+' · '+r1(e.pCP||0)+' kg')
      + rescon);
  }

  /* ══ GRAPHIQUE 7 jours ══ */
  var _chart=null;
  function drawChart(){
    if(!window.Chart) return;
    var labels=[], dUld=[], dSac=[], dCab=[], dPpi=[];
    for(var i=6;i>=0;i--){ var d=new Date(_date+'T12:00:00'); d.setDate(d.getDate()-i); var iso=d.toISOString().slice(0,10);
      labels.push(iso.slice(8,10)+'/'+iso.slice(5,7)); dUld.push(uld(iso).total); dSac.push(sac(iso).total); dCab.push(cabine(iso).vols);
      var p=ppi(iso).tot; dPpi.push(p.oo+p.os+p.sing+p.cp); }
    var ctx=$('dg-chart').getContext('2d');
    if(_chart) _chart.destroy();
    _chart=new Chart(ctx,{ type:'line', data:{ labels:labels, datasets:[
      { label:'ULD', data:dUld, borderColor:'#003189', backgroundColor:'rgba(0,49,137,.08)', tension:.35, fill:true },
      { label:'PPI', data:dPpi, borderColor:'#E0A800', backgroundColor:'rgba(224,168,0,.08)', tension:.35, fill:true },
      { label:'Sacs', data:dSac, borderColor:'#0A7C8A', tension:.35 },
      { label:'Cabine', data:dCab, borderColor:'#B24020', tension:.35 } ]},
      options:{ responsive:true, plugins:{ legend:{ labels:{ color:'#5B6472', font:{size:11} } } },
        scales:{ x:{ ticks:{ color:'#8A93A3' }, grid:{ color:'rgba(0,0,0,.04)' } }, y:{ ticks:{ color:'#8A93A3' }, grid:{ color:'rgba(0,0,0,.05)' }, beginAtZero:true } } } });
  }

  /* ══ PARTAGE (mail / PDF) ══ */
  function checkedKpis(){ return Array.prototype.slice.call(document.querySelectorAll('.dg-chk:checked')).map(function(c){ return c.getAttribute('data-share'); }); }
  function summaryText(){
    var c=cabine(_date), s=sac(_date), pp=ppi(_date), u=uld(_date), va=vpgAno(_date), sel=checkedKpis();
    var all=!sel.length; function on(id){ return all||sel.indexOf(id)>=0; }
    var L=['RÉCAP JOURNÉE — '+frLabel(_date)+' — PIC Gillot Import',''];
    if(on('uld')) L.push('• ULD : '+u.total+' (flashés '+u.flashe+', non faits '+u.nonFait+')');
    if(on('ppi')){ var t=pp.tot; L.push('• PPI : OO '+t.oo+' / OS '+t.os+' / Singapour '+t.sing+' / CP84 '+t.cp); }
    if(on('sac')) L.push('• Sacs CP84 : '+s.total+' ('+ 'PRIO '+s.prio+'/'+s.poidsPrio+'kg, ECO '+s.eco+'/'+s.poidsEco+'kg)');
    if(on('cabine')) L.push('• Cabine : '+c.vols+' dépêches · '+c.poids+' kg');
    if(on('mrd')) L.push('• MRD non faits : '+u.nonFait+' / '+u.total);
    if(on('vpgano')) L.push('• VPG '+va.vpg+' · Anomalies '+va.ano);
    return L.join('\n');
  }
  function shareMail(){ var subj='Récap journée '+_date+' — Gillot Import'; var body=summaryText();
    window.location.href='mailto:?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body); }
  function sharePdf(){ toast('Génération PDF via impression…'); setTimeout(function(){ window.print(); }, 300); }

  /* ── câblage ── */
  function wire(){
    $('dg-date').addEventListener('change', function(){ _date=this.value||_date; render(); });
    $('dg-prev').addEventListener('click', function(){ shift(-1); });
    $('dg-next').addEventListener('click', function(){ shift(1); });
    $('dg-todaybtn').addEventListener('click', function(){ _date=new Date().toISOString().slice(0,10); render(); });
    $('dg-print').addEventListener('click', function(){ window.print(); });
    $('dg-home').addEventListener('click', goHome);
    $('dg-m-x').addEventListener('click', closeModal);
    $('dg-modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
    $('dg-share-mail').addEventListener('click', shareMail);
    $('dg-share-pdf').addEventListener('click', sharePdf);
    $('dg-grid').addEventListener('click', function(e){
      var d=e.target.closest('[data-detail]'); if(d){ detail(d.getAttribute('data-detail')); return; }
      var p=e.target.closest('[data-ppi]'); if(p){ ppiDetail(p.getAttribute('data-ppi')); return; }
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if($('dg-modal').classList.contains('show')) closeModal(); } });
  }
  function shift(n){ var d=new Date(_date+'T12:00:00'); d.setDate(d.getDate()+n); _date=d.toISOString().slice(0,10); render(); }
  function goHome(){ try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'olympe-close-app'},'*'); return; } }catch(e){} try{ window.location.href='/'; }catch(e){} }

  wire(); render();
})();
</script>
</body>
</html>
