<style>
/* ── Palette relevée sur le mode jour du hub (olympe-hub-theme) ────────── */
:root{
  --lpb:#0E4194;        /* bleu La Poste            */
  --lpbf:#092C68;       /* bleu foncé               */
  --lpj:#FDDD09;        /* jaune La Poste           */
  --lpc:#00A8A8;        /* cyan                     */
  --lpv:#009841;        /* vert                     */
  --lpr:#E51932;        /* rouge                    */

  --champ:
    radial-gradient(120% 55% at 100% 0%, rgba(253,221,9,.34), transparent 62%),
    radial-gradient(85% 45% at 0% 6%, rgba(0,168,168,.20), transparent 60%),
    linear-gradient(170deg,#FBFCFF 0%,#F1F6FD 50%,#E9F0FB 100%);

  --carte:#FFFFFF;
  --bord:rgba(14,65,148,.14);
  --bord-fort:rgba(14,65,148,.26);
  --ombre:0 8px 24px rgba(14,65,148,.10);
  --ombre-h:0 16px 34px rgba(14,65,148,.18);

  --txt:#0F2A5C;
  --txt-doux:rgba(14,65,148,.78);
  --txt-faible:rgba(14,65,148,.55);

  --rayon:14px; --nav-w:248px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); color:var(--txt);
  background:#F1F6FD; font-size:15px; line-height:1.62; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* champ coloré : posé en fixed pour ne pas repeindre au défilement */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--champ)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Bandeau : reste bleu La Poste, c'est la signature de marque ───────── */
.ohead{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(135deg,var(--lpb),#0a3180);
  border-bottom:3px solid var(--lpj);
  padding:10px 16px; display:flex; align-items:center; gap:12px;
  box-shadow:0 6px 22px rgba(14,65,148,.22);
}
.ohead .logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  background:linear-gradient(135deg,var(--lpj),#FFA500);
  color:#003189;font-weight:900;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.ohead .ti{flex:1;min-width:0}
.ohead h1{margin:0;font-size:15px;font-weight:900;letter-spacing:.6px;color:#fff}
.ohead .sub{font-size:10.5px;color:rgba(255,255,255,.68);letter-spacing:1.1px;text-transform:uppercase}
.btn{
  font-family:var(--f); font-size:12px; font-weight:800; letter-spacing:.4px;
  padding:8px 13px; border-radius:9px; cursor:pointer; white-space:nowrap;
  border:1.5px solid rgba(255,255,255,.34); background:rgba(255,255,255,.16); color:#fff;
  display:inline-flex; align-items:center; gap:6px; transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.28)}
.btn:focus-visible{outline:3px solid var(--lpj);outline-offset:2px}
.btn-jaune{background:var(--lpj);border-color:var(--lpj);color:#062045;
  box-shadow:2px 2px 0 rgba(14,65,148,.20)}
.btn-jaune:hover{background:#ffe84d}
#btnRetour{display:none}
/* dans le corps de page (barre process), les boutons repassent en clair */
.pbar .btn{border-color:var(--bord-fort);background:#fff;color:var(--lpb)}
.pbar .btn:hover{background:#F2F6FD}
.pbar .btn-jaune{background:var(--lpj);border-color:var(--lpj);color:#062045}
.pbar .btn-jaune:hover{background:#ffe84d}
a.btn{text-decoration:none}

/* ── Ossature ─────────────────────────────────────────────────────────── */
.wrap{position:relative;z-index:1;display:flex;align-items:flex-start;gap:0}
nav.onav{
  width:var(--nav-w); flex:0 0 var(--nav-w); position:sticky; top:62px;
  max-height:calc(100vh - 62px); overflow-y:auto; padding:16px 12px 40px;
  border-right:1px solid var(--bord);
}
nav.onav .grp{font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--lpb);opacity:.65;margin:16px 8px 7px}
nav.onav a{
  display:flex;align-items:center;gap:9px;padding:8px 10px;margin-bottom:3px;
  border-radius:9px;color:var(--txt-doux);text-decoration:none;font-size:13px;font-weight:600;
  border-left:3px solid transparent; transition:.16s;
}
nav.onav a:hover{background:#fff;color:var(--lpb);box-shadow:var(--ombre)}
nav.onav a.on{background:#fff;color:var(--lpb);font-weight:800;
  border-left-color:var(--lpj);box-shadow:var(--ombre)}
nav.onav a .pt{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--lpj)}

main{flex:1;min-width:0;padding:22px 22px 80px;max-width:1080px}

.otabs{display:none;gap:6px;overflow-x:auto;padding:9px 12px;position:sticky;top:60px;z-index:30;
  background:rgba(247,250,255,.97);border-bottom:1px solid var(--bord);
  -webkit-overflow-scrolling:touch}
.otabs::-webkit-scrollbar{display:none}
.otabs a{flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;
  text-decoration:none;color:var(--txt-doux);background:#fff;border:1px solid var(--bord)}
.otabs a.on{background:var(--lpj);color:#062045;border-color:var(--lpj);
  box-shadow:2px 2px 0 rgba(14,65,148,.16)}

/* ── Contenu ──────────────────────────────────────────────────────────── */
section.vue{display:none;animation:ap .26s ease both}
section.vue.on{display:block}
@keyframes ap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h2.t{font-size:22px;font-weight:900;margin:0 0 4px;letter-spacing:.3px;color:var(--lpb)}
.t-sub{font-size:12.5px;color:var(--txt-faible);margin-bottom:20px;letter-spacing:.5px}
h3{font-size:15px;font-weight:900;color:var(--lpb);margin:26px 0 10px;
  display:flex;align-items:center;gap:8px;padding-bottom:6px;
  border-bottom:2px solid var(--lpj)}
h4{font-size:13.5px;font-weight:800;margin:16px 0 6px;color:var(--lpbf)}
p{margin:0 0 11px}
ul,ol{margin:0 0 12px;padding-left:20px}
li{margin-bottom:5px}
b,strong{color:var(--lpbf);font-weight:800}
i,em{color:var(--lpb)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;
  background:#F2F6FD;border:1px solid var(--bord);border-radius:5px;padding:1px 5px;
  color:var(--lpbf);word-break:break-word}

.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);
  padding:15px 17px;margin-bottom:12px;box-shadow:var(--ombre)}
.carte.acc{border-left:4px solid var(--lpj)}
.enc{border-radius:var(--rayon);padding:14px 16px;margin:14px 0;
  border:1px solid var(--bord);border-left:4px solid var(--lpj);
  background:#FFFCEB;box-shadow:var(--ombre)}
.enc.ok{border-left-color:var(--lpv);background:#EFFBF3}
.enc.no{border-left-color:var(--lpr);background:#FFF1F3}
.enc.inf{border-left-color:var(--lpc);background:#EEFAFA}
.enc .ttl{font-weight:900;font-size:13px;margin-bottom:5px;color:var(--lpbf)}
.enc p:last-child,.enc ul:last-child,.enc ol:last-child{margin-bottom:0}

.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:14px}

table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:12.6px;
  background:#fff;border:1px solid var(--bord);border-radius:10px;overflow:hidden;
  display:block;overflow-x:auto;box-shadow:var(--ombre)}
thead tr{background:linear-gradient(135deg,var(--lpb),#0a3180)}
th{color:var(--lpj);font-weight:900;text-align:left;padding:9px 11px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--bord);color:var(--txt-doux);vertical-align:top}
tbody tr:nth-child(even){background:#F7FAFF}
td b{color:var(--lpbf)}

/* fiches app */
.appcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.appcard{display:flex;gap:11px;align-items:flex-start;text-decoration:none;
  background:#fff;border:1px solid var(--bord);border-radius:var(--rayon);
  padding:13px 14px;border-top:3px solid var(--ac,var(--lpj));transition:.18s;
  color:inherit;box-shadow:var(--ombre)}
.appcard:hover{transform:translateY(-2px);box-shadow:var(--ombre-h)}
.appcard .em{font-size:22px;line-height:1}
.appcard .n{font-weight:900;font-size:13.5px;color:var(--lpb)}
.appcard .d{font-size:11.5px;color:var(--txt-faible);line-height:1.45}

.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 16px;
  padding:12px 14px;border-radius:var(--rayon);background:#fff;
  border:1px solid var(--bord);border-left:5px solid var(--ac,var(--lpj));
  box-shadow:var(--ombre)}
.pbar .em{font-size:26px}
.pbar .nm{font-weight:900;font-size:16px;flex:1;min-width:130px;color:var(--lpb)}
.pbar .nm small{display:block;font-weight:600;font-size:11px;color:var(--txt-faible);letter-spacing:.4px}

ol.etapes{counter-reset:e;list-style:none;padding:0;margin:0 0 14px}
ol.etapes li{counter-increment:e;position:relative;padding:11px 14px 11px 46px;margin-bottom:8px;
  background:#fff;border:1px solid var(--bord);border-radius:11px;font-size:13.4px;
  box-shadow:var(--ombre)}
ol.etapes li::before{content:counter(e);position:absolute;left:11px;top:10px;
  width:24px;height:24px;border-radius:7px;
  background:var(--ac,var(--lpj));color:var(--ac-fg,#062045);
  font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}

.pied{margin-top:36px;padding-top:16px;border-top:1px solid var(--bord);
  font-size:10.5px;color:var(--txt-faible);letter-spacing:.8px;text-align:center}

/* ── Responsive ───────────────────────────────────────────────────────── */
@media screen and (max-width:900px){
  nav.onav{display:none}
  .otabs{display:flex}
  main{padding:16px 13px 70px}
  h2.t{font-size:19px}
  .ohead .sub{display:none}
}
/* ── Impression ───────────────────────────────────────────────────────── */
@media print{
  body{background:#fff}
  body::before,.ohead,nav.onav,.otabs,.pbar .btn,#btnRetour{display:none!important}
  main{max-width:none;padding:0}
  section.vue{display:block!important;page-break-after:always}
  .carte,.enc,ol.etapes li,table,.appcard,.pbar{box-shadow:none;border:1px solid #bbb}
  thead tr{background:#0E4194!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#000;text-decoration:none}
}
</style>
<style id="olympe-infos-anim">
/* ══════════════════════════════════════════════════════════════════════════
   OLYMPE INFOS — COUCHE D'ANIMATION
   Posée après la feuille de base : elle gagne par ordre d'insertion, sans
   qu'aucune règle existante soit réécrite.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Décor de fond : chevrons de marque en dérive lente ──────────────────── */
#lp-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#lp-decor i{position:absolute;display:block;opacity:.16;
  font-style:normal;font-weight:900;color:var(--lpj);
  will-change:transform;animation:derive linear infinite}
@keyframes derive{
  from{transform:translate3d(0,0,0) rotate(0deg)}
  to  {transform:translate3d(0,-130vh,0) rotate(180deg)}
}

/* ── Bandeau : reflet balayant ───────────────────────────────────────────── */
.ohead{position:sticky;overflow:hidden}
.ohead::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-18deg);animation:balaye 6.5s var(--e,cubic-bezier(.22,.85,.28,1)) infinite;
  pointer-events:none}
@keyframes balaye{0%{left:-45%}55%{left:118%}100%{left:118%}}
.ohead .logo{animation:respire 4.2s ease-in-out infinite}
@keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}

/* ── Bande quadrichrome sous le bandeau ──────────────────────────────────── */
.ohead::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--lpb) 0 25%,var(--lpr) 25% 50%,
    var(--lpj) 50% 75%,var(--lpv) 75% 100%);
  background-size:200% 100%;animation:coule 9s linear infinite;z-index:2}
@keyframes coule{from{background-position:0 0}to{background-position:200% 0}}

/* ── Entrée de vue : cascade ─────────────────────────────────────────────── */
section.vue.on > *{animation:monte .5s cubic-bezier(.22,.85,.28,1) both;
  animation-delay:calc(var(--i,0) * 45ms)}
@keyframes monte{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ── Titres : soulignement qui se déploie ────────────────────────────────── */
h3{position:relative;border-bottom-color:transparent!important}
h3::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;
  background:linear-gradient(90deg,var(--lpj),var(--lpc));border-radius:2px;
  animation:deploie .75s cubic-bezier(.22,.85,.28,1) .15s forwards}
@keyframes deploie{to{width:100%}}

/* ── Cartes : relief au survol, onde au clic ─────────────────────────────── */
.carte,.enc,.appcard,ol.etapes li,table{transition:transform .28s cubic-bezier(.22,.85,.28,1),
  box-shadow .28s ease}
.carte:hover,.enc:hover{transform:translateY(-2px);box-shadow:var(--ombre-h)}
.appcard{position:relative;overflow:hidden}
.appcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(72deg,transparent 42%,rgba(253,221,9,.38) 50%,transparent 58%);
  transform:translateX(-120%);transition:transform .65s cubic-bezier(.22,.85,.28,1)}
.appcard:hover::after{transform:translateX(120%)}
.appcard:hover{transform:translateY(-4px) scale(1.012)}
.appcard .em{transition:transform .35s cubic-bezier(.34,1.5,.5,1)}
.appcard:hover .em{transform:scale(1.22) rotate(-7deg)}

/* ── Étapes : pastille qui pousse, ligne de liaison ──────────────────────── */
ol.etapes{position:relative}
ol.etapes li{position:relative}
ol.etapes li::after{content:"";position:absolute;left:22px;top:38px;bottom:-8px;width:2px;
  background:linear-gradient(180deg,var(--ac,var(--lpj)),transparent);opacity:.35}
ol.etapes li:last-child::after{display:none}
ol.etapes li::before{animation:pousse .5s cubic-bezier(.34,1.5,.5,1) both;
  animation-delay:calc(var(--i,0) * 70ms + .1s)}
@keyframes pousse{from{opacity:0;transform:scale(.4) rotate(-25deg)}to{opacity:1;transform:none}}
ol.etapes li:hover{transform:translateX(4px)}

/* ── Onglets mobiles : pilule qui glisse ─────────────────────────────────── */
.otabs a{transition:background .25s ease,color .25s ease,transform .25s cubic-bezier(.34,1.5,.5,1)}
.otabs a.on{transform:scale(1.045)}
nav.onav a{transition:background .2s ease,border-left-color .2s ease,transform .2s ease}
nav.onav a:hover{transform:translateX(3px)}

/* ── Révélation au défilement ────────────────────────────────────────────── */
.rev{opacity:0;transform:translateY(22px);
  transition:opacity .6s cubic-bezier(.22,.85,.28,1),transform .6s cubic-bezier(.22,.85,.28,1)}
.rev.vu{opacity:1;transform:none}

/* ══ ILLUSTRATIONS ═════════════════════════════════════════════════════════ */
.illu{position:relative;margin:0 0 18px;border-radius:var(--rayon);overflow:hidden;
  background:linear-gradient(160deg,#FFFFFF,#F4F8FE);
  border:1px solid var(--bord);box-shadow:var(--ombre)}
.illu svg{display:block;width:100%;height:auto}
.illu .lgd{position:absolute;left:12px;bottom:12px;font-size:10.5px;font-weight:800;
  letter-spacing:.7px;text-transform:uppercase;color:var(--lpb);
  background:rgba(255,255,255,.93);border:1px solid var(--bord);
  padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(14,65,148,.12);
  max-width:calc(100% - 24px);line-height:1.3}
@media screen and (max-width:520px){.illu .lgd{font-size:9px;padding:3px 8px}}

/* pièces animées communes aux SVG */
.sv-flot{stroke-dasharray:7 9;animation:flot 1.6s linear infinite}
@keyframes flot{to{stroke-dashoffset:-32}}
/* transform-box:fill-box est obligatoire : sans lui, transform-origin:center
   désigne le centre du viewBox et l'élément part en diagonale en grandissant. */
.sv-puls,.sv-halo,.sv-tourne,.sv-mont{transform-box:fill-box;transform-origin:center}
.sv-puls{animation:puls 2.6s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
/* Halo : plage d'opacité propre. Une keyframe qui anime opacity écrase
   l'attribut opacity de l'élément — un halo posé à .10 remontait à .9. */
.sv-halo{animation:halo 3.2s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.10;transform:scale(1)}50%{opacity:.24;transform:scale(1.09)}}
.sv-vole{animation:vole 13s linear infinite}
@keyframes vole{from{transform:translateX(-90px)}to{transform:translateX(760px)}}
.sv-derive{animation:derivex 22s linear infinite}
@keyframes derivex{from{transform:translateX(0)}to{transform:translateX(90px)}}
.sv-mont{transform-origin:center bottom;animation:mont 3.4s ease-in-out infinite}
@keyframes mont{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sv-tourne{transform-origin:center;animation:tourne 18s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.sv-clign{animation:clign 2.2s ease-in-out infinite}
@keyframes clign{0%,100%{opacity:1}50%{opacity:.25}}
.sv-t1{animation-delay:0s}.sv-t2{animation-delay:.35s}.sv-t3{animation-delay:.7s}
.sv-t4{animation-delay:1.05s}.sv-t5{animation-delay:1.4s}

/* ── Bandeau animé en tête de fiche Process ──────────────────────────────── */
.pband{position:relative;height:88px;border-radius:var(--rayon);overflow:hidden;
  margin:0 0 14px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(135deg,var(--ac,var(--lpj)),color-mix(in srgb,var(--ac,var(--lpj)) 62%,#0B2D66));
  box-shadow:var(--ombre)}
.pband .bandes{position:absolute;inset:-40% -20%;opacity:.22;
  background:repeating-linear-gradient(115deg,#fff 0 12px,transparent 12px 34px);
  animation:defile 7s linear infinite}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-34px)}}
.pband .refl{position:absolute;top:0;bottom:0;width:34%;left:-40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:balaye 5.4s ease-in-out infinite}
.pband .bem{position:relative;font-size:38px;line-height:1;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));animation:mont 3.4s ease-in-out infinite}
.pband .btx{position:relative;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.30)}
.pband .btx b{display:block;font-size:19px;font-weight:900;letter-spacing:.3px;color:#fff}
.pband .btx span{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  opacity:.9}
.pband .bnum{position:relative;margin-left:auto;font-size:11px;font-weight:800;color:#fff;
  background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.35);
  padding:5px 11px;border-radius:999px;letter-spacing:.6px}

/* ── Compteurs de la fiche technique ─────────────────────────────────────── */
.cpt{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin:4px 0 16px}
.cpt div{background:#fff;border:1px solid var(--bord);border-radius:var(--rayon);
  padding:11px 8px;text-align:center;box-shadow:var(--ombre);
  transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.cpt div:hover{transform:translateY(-3px) scale(1.03)}
.cpt .n{font-size:24px;font-weight:900;color:var(--lpb);line-height:1;
  font-variant-numeric:tabular-nums}
.cpt .l{font-size:9px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  color:var(--txt-faible);margin-top:4px}

/* ══ RESPECT DU CONTEXTE ═══════════════════════════════════════════════════ */

/* Onglet en arrière-plan : toute la scène est mise en pause. Une animation
   qui tourne dans un onglet caché ne sert personne et vide la batterie. */
body.pause *,body.pause *::before,body.pause *::after{animation-play-state:paused!important}

}

  /* ═══════════════════════════════════════════════════════════════════════
     MOTEUR D'ANIMATION
     Tout est piloté par CSS ; le JS ne fait que poser des classes et des
     variables. Aucune boucle requestAnimationFrame : c'est ce qui permet de
     tourner sur une tablette sans chauffer.
     ═══════════════════════════════════════════════════════════════════ */

  var REDUIT = false;
  try {
    REDUIT = window.matchMedia &&
             window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {}

  /* Décor de fond : chevrons de marque en dérive. Générés une fois, jamais
     retouchés — ils vivent hors du flux et n'interceptent aucun clic. */
  function poserDecor() {
    if (document.getElementById('lp-decor')) return;
    var d = document.createElement('div');
    d.id = 'lp-decor';
    d.setAttribute('aria-hidden', 'true');
    var n = window.innerWidth < 640 ? 6 : 11, h = '';
    for (var i = 0; i < n; i++) {
      var x = Math.round(Math.random() * 96);
      var t = 26 + Math.round(Math.random() * 30);      // durée
      var r = Math.round(Math.random() * t);            // décalage négatif
      var z = 16 + Math.round(Math.random() * 30);      // taille
      h += '<i style="left:' + x + '%;top:' + (100 + Math.round(Math.random() * 40)) + '%;' +
           'font-size:' + z + 'px;animation-duration:' + t + 's;' +
           'animation-delay:-' + r + 's;">\u203A</i>';
    }
    d.innerHTML = h;
    document.body.insertBefore(d, document.body.firstChild);
  }

  /* Cascade : chaque enfant direct de la vue active reçoit son rang, le CSS
     s'occupe du décalage. Reposé à chaque changement de vue. */
  function cascade(vueEl) {
    var k = 0;
    Array.prototype.forEach.call(vueEl.children, function (el) {
      el.style.setProperty('--i', k++);
    });
    Array.prototype.forEach.call(vueEl.querySelectorAll('ol.etapes li'), function (li, i) {
      li.style.setProperty('--i', i);
    });
  }

  /* Révélation au défilement. IntersectionObserver plutôt qu'un écouteur de
     scroll : pas de calcul à chaque pixel. Repli gracieux si l'API manque. */
  var obs = null;
  if (!REDUIT && window.IntersectionObserver) {
    obs = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('vu');
        if (e.target.querySelector && e.target.querySelector('[data-cpt]')) {
          compter(e.target);
        }
        obs.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
  }

  function observer(vueEl) {
    var cibles = vueEl.querySelectorAll('.rev');
    if (!obs) {
      Array.prototype.forEach.call(cibles, function (el) {
        el.classList.add('vu');
        if (el.querySelector('[data-cpt]')) compter(el);
      });
      return;
    }
    Array.prototype.forEach.call(cibles, function (el) {
      if (!el.classList.contains('vu')) obs.observe(el);
    });
  }

  /* Compteurs : montée en 900 ms, arrondi entier, sans dépendance. */
  function compter(hote) {
    Array.prototype.forEach.call(hote.querySelectorAll('[data-cpt]'), function (el) {
      var cible = parseInt(el.getAttribute('data-cpt'), 10) || 0;
      if (REDUIT) { el.textContent = cible; return; }
      var t0 = 0, duree = 900;
      function pas(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / duree);
        var doux = 1 - Math.pow(1 - p, 3);            // sortie cubique
        el.textContent = Math.round(cible * doux);
        if (p < 1) requestAnimationFrame(pas);        // s'arrête tout seul
      }
      requestAnimationFrame(pas);
    });
  }

  /* Onglet caché : pause complète. Une animation invisible ne sert personne. */
  function brancherPause() {
    document.addEventListener('visibilitychange', function () {
      document.body.classList.toggle('pause', document.hidden);
    });
  }

    var navHtml = '<div class="grp">Documentation</div>';
    var tabHtml = '';

    RUBRIQUES.forEach(function(r){
      var corps = illusDe(r.id) + ((r.html === '<!--TECH-->') ? htmlTechnique() : r.html);
      main.appendChild(vue(r.id, r.emoji+' '+r.titre, r.sous, corps));
      navHtml += '<a href="#'+r.id+'" data-v="'+r.id+'"><span>'+r.emoji+'</span>'+r.titre+'</a>';
      tabHtml += '<a href="#'+r.id+'" data-v="'+r.id+'">'+r.emoji+' '+r.titre.replace('&amp;','&')+'</a>';
    });

    navHtml += '<div class="grp">📚 Process des apps</div>';
    APPS.forEach(function(a){
      main.appendChild(vue('process/'+a.id, a.emoji+' '+a.nom, 'Process · '+a.res, htmlProcess(a)));
      navHtml += '<a href="#process/'+a.id+'" data-v="process/'+a.id+'">'+
                 '<span class="pt" style="background:'+a.ac+'"></span>'+a.nom+'</a>';
      tabHtml += '<a href="#process/'+a.id+'" data-v="process/'+a.id+'">'+a.emoji+' '+a.nom+'</a>';
    });

    nav.innerHTML = navHtml;
    tabs.innerHTML = tabHtml;
  }

  /* --- routage par ancre ------------------------------------------------ */
  function routeur(){
    var id = (location.hash || '').replace(/^#/, '') || 'apropos';
    var cible = document.getElementById('vue-' + id);
    if(!cible){ id = 'apropos'; cible = document.getElementById('vue-apropos'); }
    if(!cible) return;

    Array.prototype.forEach.call(document.querySelectorAll('section.vue'), function(s){
      s.classList.remove('on');
    });
    cible.classList.add('on');
    cascade(cible);
    observer(cible);

    Array.prototype.forEach.call(document.querySelectorAll('[data-v]'), function(a){
      a.classList.toggle('on', a.getAttribute('data-v') === id);
    });

    // remonter en haut + recentrer l'onglet actif sur mobile
    window.scrollTo(0, 0);
    var actif = tabs.querySelector('a.on');
    if(actif && actif.scrollIntoView){
      try{ actif.scrollIntoView({block:'nearest', inline:'center'}); }catch(e){}
    }
    document.title = cible.querySelector('.t').textContent + ' — Olympe';
  }

  /* --- retour à l'application ------------------------------------------ */
  // 3 stratégies, de la plus propre à la plus rustique :
  //   1. le hub parent expose OlympeProcess.fermer()  → overlay refermé
  //   2. postMessage au parent                        → le hub décide
  //   3. history.back() / fermeture d'onglet          → page ouverte seule
  function retour(appId){
    var cible = appId || paramFrom();
    try{
      if(window.parent && window.parent !== window){
        if(window.parent.OlympeProcess && typeof window.parent.OlympeProcess.fermer === 'function'){
          window.parent.OlympeProcess.fermer(cible);
          return;
        }
        window.parent.postMessage({ type:'OLYMPE_PROCESS_RETOUR', app: cible || null }, '*');
        return;
      }
    }catch(e){ /* origine différente : on tombe dans le cas autonome */ }

    if(window.opener && !window.opener.closed){ window.close(); return; }
    if(history.length > 1){ history.back(); return; }
    location.href = 'index2.html';
  }

  function paramFrom(){
    var m = /[?&]from=([A-Za-z0-9_-]+)/.exec(location.search);
    return m ? m[1] : null;
  }

  /* --- init ------------------------------------------------------------- */
  function init(){
    construire();
    poserDecor();
    brancherPause();
    window.addEventListener('hashchange', routeur);
    routeur();

    // bouton « Retour à l'app » du bandeau : visible si on vient d'une app
    var from = paramFrom();
    var embarque = false;
    try{ embarque = (window.parent && window.parent !== window); }catch(e){ embarque = true; }
    if(from || embarque){
      btnRetour.style.display = 'inline-flex';
      btnRetour.addEventListener('click', function(){ retour(from); });
    }
    // si on arrive avec ?from=xxx sans ancre, ouvrir directement le process
    if(from && !location.hash && document.getElementById('vue-process/'+from)){
      location.hash = 'process/' + from;
    }

    // Échap = retour
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && btnRetour.style.display !== 'none') retour(from);
    });
  }

  window.OlympeInfos = { retour: retour, apps: APPS };

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
</body>
</html>
